<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>stegassette/album has moved</title>
    <!-- The album console is gone. Releases is where encoded albums live now,
         so this forwards there. The path was served and has been shared —
         /audio-console forwarded here for exactly that reason — so it
         forwards rather than 404s. Same reasoning as the redirects in
         public-library: GitHub Pages has no _redirects equivalent, so it is a
         real page with a meta refresh and a canonical link. -->
    <meta http-equiv="refresh" content="0; url=https://stega.now/releases/" />
    <link rel="canonical" href="https://stega.now/releases/" />
    <meta name="robots" content="noindex" />
    <style>
      body { background:#000; color:#eee; font:14px/1.6 ui-monospace,monospace;
             margin:0; min-height:100vh; display:flex; align-items:center;
             justify-content:center; } a { color:#eee; }
    </style>
  </head>
  <body>
    <p>stegassette/album is now at <a href="https://stega.now/releases/">https://stega.now/releases/</a>.</p>
  </body>
</html>
