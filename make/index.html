        const estMB = ((estPx * 4) / 1048576).toFixed(0);
        const SAFARI_MAX = 16777216; // ~4096² — Safari/iOS hard canvas cap
        const HARD_WARN = 100 * 1048576; // ~100 MP — heavy even on desktop Chrome
        if (estPx > HARD_WARN && !batch) {
          const side = Math.round(Math.sqrt(estPx));
          if (
            !confirm(
              `This encode needs roughly a ${side}×${side} image (~${(estPx / 1048576).toFixed(0)} MP, ~${estMB} MB in memory).\n\n` +
                `That may be slow or run out of memory. To shrink it, lower the sample rate, use mono, or 16-bit.\n\nEncode anyway?`,
            )
          ) {
            estats.textContent = "✗ cancelled — payload too large";
            encBtn.disabled = false;
            return;
          }
        }
        say(
          estPx > SAFARI_MAX
            ? `encoding… (~${(estPx / 1048576).toFixed(1)} MP — won't open in Safari/iOS)`
            : "encoding…",
        );
        await new Promise((r) => setTimeout(r, 20));

        try {
          const chN = mixed.length;
          // hand the raw RGBA + entries to the worker (buffers are transferred,
          // so srcImg/entries are emptied on this thread after this call)
          const { blob, outW, outH } = await encodeViaWorker({
            srcData: srcImg.data,
            srcW,
            srcH,
            entries,
            opts,
            B,
            aspectOverride,
            planBpp,
          });

          const srcFile =
            !over && encFrameCanvases.length > 0 ? encVideoFile : imgFile;
          const base = (srcFile?.name || "frame").replace(/\.[^.]+$/, "");

          // travP holds the exact traversal params used (seed generated above),
          // so we don't decode the just-encoded image again to read them back.
          const pTag =
            traversal === "angle"
              ? `-a${travP.a ?? 1}b${travP.b ?? 1}`
              : traversal === "fisher-yates"
                ? `-s${travP.seed}`
                : "";
          const fname =
            over?.fname || `${base}-${opts.traversal}${pTag}-${opts.combine}.png`;

          // batch chunks download straight away and leave the UI untouched
          if (batch) {
            const url = URL.createObjectURL(blob);
            Object.assign(document.createElement("a"), {
              href: url,
              download: fname,
            }).click();
            setTimeout(() => URL.revokeObjectURL(url), 30000);
            encBtn.disabled = false;
            return { outW, outH, fname };
          }

          lastBlobUrl = URL.createObjectURL(blob);
          dlBtn.style.display = "";
          dlBtn.onclick = () =>
            Object.assign(document.createElement("a"), {
              href: lastBlobUrl,
              download: fname,
            }).click();

          const scaled =
            outW !== srcW || outH !== srcH
              ? ` (scaled from ${srcW}×${srcH})`
              : "";
          const trimStr = wantAudio
            ? `  ·  ${clipS.toFixed(3)}–${clipE.toFixed(3)}s`
            : "";
          const extraStr =
            additionalTracks.length + additionalEntries.length > 0
              ? `  ·  +${additionalTracks.length} tracks  +${additionalEntries.length} entries`
              : "";
          const layoutStr = layout !== "planar" ? `  ·  ${layout}` : "";
          const pStr =
            traversal === "angle"
              ? ` (a=${travP.a ?? 1} b=${travP.b ?? 1})`
              : traversal === "fisher-yates"
                ? ` (seed=${travP.seed})`
                : "";
          const audioStr = wantAudio
            ? `  ·  ${tgtBit}bit ${tgtSr}Hz ${chN}ch${layoutStr}`
            : "  ·  data-only";
          estats.textContent =
            `encoded  ·  ${outW}×${outH}${scaled}${trimStr}` +
            `${audioStr}  ·  ${opts.traversal}${pStr}  ·  ${opts.combine}${extraStr}`;
          encBtn.disabled = false;

          // auto-load into player
          pload(blob);
        } catch (e) {
          encBtn.disabled = false;
          if (batch) throw e;
          estats.textContent = "✗ " + e.message;
        }
      }

      // encode every chunk in order, downloading each PNG as it lands
      async function encodeAllChunks() {
        if (!chunks.length) {
          ckMsg.textContent = "no chunks yet";
          return;
        }
        const missing = chunks.filter((c) => !droppedFiles.get(c.image));
        if (missing.length) {
          ckMsg.textContent = `${missing.length} chunk${missing.length === 1 ? "" : "s"} without a loaded image — drop them first`;
          return;
        }
        stopPreview();
        const btn = document.getElementById("ckEncodeAllBtn");
        btn.disabled = true;
        const outBase = seriesOutBase();
        let done = 0;
        for (let i = 0; i < chunks.length; i++) {
          const c = chunks[i];
          ckMsg.textContent = `encoding ${i + 1}/${chunks.length}…`;
          estats.textContent = `series: chunk ${i + 1}/${chunks.length}`;
          try {
            await runEncode({
              startS: c.s,
              endS: c.e,
              imgFile: droppedFiles.get(c.image),
              entries: c.entries,
              name: c.name,
              download: true,
              // a chunk `out` can name a folder ("live/03-…"); a download only
              // gets the leaf
              fname: `${chunkOutName(c, i).split("/").pop()}.png`,
            });
            done++;
          } catch (e) {
            ckMsg.textContent = `✗ chunk ${i + 1}: ${e.message}`;
            estats.textContent = `✗ chunk ${i + 1}: ${e.message}`;
            break;
          }
        }
        btn.disabled = false;
        if (done === chunks.length) {
          ckMsg.textContent = `encoded ${done} image${done === 1 ? "" : "s"} → downloads`;
          estats.textContent = `series encoded  ·  ${done} images from ${outBase}`;
        }
      }
      document
        .getElementById("ckEncodeAllBtn")
        .addEventListener("click", encodeAllChunks);

      // ═══════════════════════════════════════════════════════════════════
      // GLOBAL DROP — route by file type
      // ═══════════════════════════════════════════════════════════════════

      document.addEventListener("dragover", (e) => {
        e.preventDefault();
        const items = e.dataTransfer?.items;
        if (!items || !items.length) return;
        const type = items[0].type;
        document.body.classList.remove("drag-audio", "drag-image");
        if (type.startsWith("audio/"))
          document.body.classList.add("drag-audio");
        else if (type.startsWith("video/") || type.startsWith("image/"))
          document.body.classList.add("drag-image");
      });

      document.addEventListener("dragleave", (e) => {
        if (!e.relatedTarget || !document.contains(e.relatedTarget)) {
          document.body.classList.remove("drag-audio", "drag-image");
          delete adrop.dataset.state;
          delete idrop.dataset.state;
        }
      });

      const isJsonFile = (f) =>
        f.type === "application/json" || /\.json$/i.test(f.name);

      document.addEventListener("drop", async (e) => {
        // only handle drops that didn't land on a specific dropzone
        if (e.target.closest(".drop")) return;
        e.preventDefault();
        document.body.classList.remove("drag-audio", "drag-image");
        const files = [...(e.dataTransfer?.files || [])];
        if (!files.length) return;

        const jsonFiles = files.filter(isJsonFile);
        const mediaFiles = files.filter((f) => !isJsonFile(f));

        // stash every dropped media file so jobs can auto-attach by filename
        for (const f of mediaFiles) stashDroppedFile(f);

        // load a dropped jobs file (array → queue; object → single config)
        for (const jf of jsonFiles) {
          try {
            const parsed = JSON.parse(await jf.text());
            if (Array.isArray(parsed)) loadJobsArray(parsed);
            else applyConfig(parsed);
          } catch (err) {
            estats.textContent = "✗ bad JSON: " + err.message;
          }
        }

        // a lone media drop still loads directly into the editor (prior
        // behavior) — unless a job queue is active, where it's a source to
        // stash, or series mode, where images are chunk covers, not the slot
        if (!jobsArray && !jsonFiles.length && mediaFiles.length === 1) {
          const file = mediaFiles[0];
          const type = file.type || mimeFromFilename(file.name);
          if (type.startsWith("audio/")) onAudioFile(file);
          else if (type.startsWith("video/")) onVideoFileLoaded(file);
          else if (type === "image/png" && encMode !== "series")
            pload(file); // try as STGC; shows error in player if not
          else if (type.startsWith("image/") && encMode !== "series")
            onImageFile(file);
        }
      });

      // ── init ──────────────────────────────────────────────────────────
      // last, so every element and binding the mode touches already exists
      setMode("clip");
    </script>
  </body>
</html>
