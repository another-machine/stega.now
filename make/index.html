            haveImg: covers.length > 0 && have === covers.length,
            haveAud,
            covers,
          };
        }
        const img = baseName(job.image);
        return { img, aud, haveImg: !!(img && droppedFiles.has(img)), haveAud };
      }
      // every cover a split names, in chunk order
      function splitCoverNames(spec) {
        const parts = Array.isArray(spec.parts) ? spec.parts : [];
        const images = Array.isArray(spec.images) ? spec.images : [];
        const n = Math.max(parts.length, images.length);
        const out = [];
        for (let i = 0; i < n; i++) {
          const p = (parts[i] && parts[i].image) ?? images[i] ?? spec.image;
          if (p) out.push(p);
        }
        return out;
      }

      function renderJobsList() {
        jobsTitle.textContent = `jobs (${jobsArray.length})`;
        jobsList.innerHTML = "";
        jobsArray.forEach((job, i) => {
          const { img, aud, haveImg, haveAud } = jobFilesStatus(job);
          const row = document.createElement("div");
          row.className = "list__item";
          row.toggleAttribute("data-selected", i === jobSel);
          const label = baseName(job.out) || img || `item ${i + 1}`;
          const audioEnt = jobAudioEntry(job);
          const meta = `${(audioEnt || job).bits || 16}b·${(audioEnt || job).ch || 1}ch·${job.combine || "xor"}`;
          row.innerHTML =
            `<span class="list__index">${i + 1}</span>` +
            `<span class="list__name">${escHtml(label)}</span>` +
            `<span class="list__meta">${escHtml(meta)}</span>` +
            `<span class="ji-files">` +
            `<span class="${haveImg ? "ji-ok" : "ji-miss"}" title="${escHtml(img || "no image")}">img</span> ` +
            `<span class="${haveAud ? "ji-ok" : "ji-miss"}" title="${escHtml(aud || "no audio")}">aud</span>` +
            `</span>`;
          row.addEventListener("click", () => selectJob(i));
          jobsList.appendChild(row);
        });
      }

      function selectJob(i) {
        jobSel = i;
        const job = jobsArray[i];
        renderJobsList();
        const { img, aud, haveImg, haveAud } = jobFilesStatus(job);
        // attach the image (doesn't touch audio settings). A split job's covers
        // are per-chunk, so there's nothing to load into the single image slot.
        const f = haveImg && droppedFiles.get(img);
        if (f) f.type.startsWith("video/") ? onVideoFileLoaded(f) : onImageFile(f);
        // apply settings now; if audio will decode, defer a re-apply to
        // onAudioLoaded so the decode's sr/ch/trim reset doesn't clobber them
        applyConfig(job);
        if (haveAud) {
          pendingJobConfig = job;
          onAudioFile(droppedFiles.get(aud));
        }
        jobsMsg.textContent =
          (haveImg ? "✓ image" : `drop ${img || "image"}`) +
          " · " +
          (haveAud ? "✓ audio" : `drop ${aud || "audio"}`);
      }

      document.getElementById("jobsClear").addEventListener("click", () => {
        jobsArray = null;
        jobSel = -1;
        jobsPanel.hidden = true;
      });

      // ── chunk editor (series mode) ────────────────────────────────────
      // One audio source divided across N covers. The trim region is the
      // SOURCE WINDOW; chunks subdivide it, and each carries its own cover
      // image and text entries. This is the editor half of the jobs-file
      // `split` block — the two round-trip through gatherChunkSplit/applyConfig.
      const ckList = document.getElementById("ckList");
      const ckCount = document.getElementById("ckCount");
      const ckMsg = document.getElementById("ckMsg");
      const ckEvery = document.getElementById("ckEvery");
      const ckMaxMp = document.getElementById("ckMaxMp");
      const ckJsonKind = document.getElementById("ckJsonKind");
      const chunksSection = document.getElementById("chunksSection");

      let chunks = []; // [{ s, e (seconds), image, out, name, entries, open }]
      let chunkSel = -1;
      // the source window chunks divide — captured from the trim the first time
      // chunks are made, so selecting a chunk (which moves the trim) doesn't
      // shrink the window the next re-split works from. Cleared with ✕.
      let seriesWin = null;
      // caret placed by clicking the waveform; "÷ at caret" cuts here
      let seriesCaret = null;

      const isCoverFile = (f) =>
        (f.type || mimeFromFilename(f.name)).startsWith("image/");
      const coverFiles = () =>
        [...droppedFiles.values()]
          .filter(isCoverFile)
          .sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true }));

      // audio settings as the schema states them — shared with the batch side's
      // payload math so the editor's size estimates match what encoding costs
      function uiAudioSpec() {
        return {
          sr: parseInt(eSrEl.value) || 22050,
          ch: parseInt(eChEl.value) || 1,
          bits: parseInt(eBitsEl.value) || 16,
          mode: eModeEl.value,
        };
      }
      function uiBytesPerSecond() {
        return StegassetteJobs.splitBytesPerSecond(
          uiAudioSpec(),
          encAudioBuf ? encAudioBuf.sampleRate : null,
        );
      }
      function uiBytesPerPixel() {
        const { pack, channels } = gatherChannelPlan();
        const bps = bytesPerSampleUI();
        return Stegassette.normalizeChannelPlan(
          { combine: representativeCombine(), pack, channels, bytesPerSample: bps },
          bps,
          0,
        ).bytesPerPixel;
      }
      // output megapixels a chunk of `sec` seconds would need
      function chunkMegapixels(sec) {
        const bytes = sec * uiBytesPerSecond();
        return (Math.ceil(bytes / uiBytesPerPixel()) * 2) / 1048576;
      }

      function seriesWindow() {
        if (!seriesWin) seriesWin = { s: trimAbsS, e: trimAbsE };
        return seriesWin;
      }
      function mkChunk(s, e) {
        return { s, e, image: "", out: "", name: "", entries: [], open: false };
      }
      function makeEqualChunks(n) {
        if (!encAudioBuf) return;
        const { s, e } = seriesWindow();
        if (!(e > s)) return;
        n = Math.max(1, Math.min(500, n | 0));
        const span = (e - s) / n;
        // keep any covers/text already assigned, position by position
        const prev = chunks;
        chunks = Array.from({ length: n }, (_, i) => {
          const c = mkChunk(s + i * span, i === n - 1 ? e : s + (i + 1) * span);
          if (prev[i]) {
            c.image = prev[i].image;
            c.out = prev[i].out;
            c.name = prev[i].name;
            c.entries = prev[i].entries;
          }
          return c;
        });
        chunkSel = -1;
        renderChunks();
      }
      // divide so every chunk's payload fits `mp` output megapixels
      function fitChunks(mp) {
        if (!encAudioBuf) return;
        const { s, e } = seriesWindow();
        const total = chunkMegapixels(e - s);
        makeEqualChunks(Math.max(1, Math.ceil(total / Math.max(0.01, mp))));
      }
      function splitAtCaret() {
        if (seriesCaret == null || !chunks.length) return;
        const i = chunks.findIndex((c) => seriesCaret > c.s && seriesCaret < c.e);
        if (i < 0) return;
        const c = chunks[i];
        const right = mkChunk(seriesCaret, c.e);
        right.entries = [];
        c.e = seriesCaret;
        chunks.splice(i + 1, 0, right);
        renderChunks();
      }
      function autoAssignCovers() {
        const files = coverFiles();
        if (!files.length) {
          ckMsg.textContent = "drop some images first";
          return;
        }
        // With no chunks yet, the loaded covers ARE the count — one chunk per
        // image is what "spread this audio over these images" means. Typing the
        // number into `equal` first would just be repeating what's on screen.
        const fresh = !chunks.length;
        if (fresh) makeEqualChunks(files.length);
        chunks.forEach((c, i) => {
          if (files[i]) c.image = files[i].name;
        });
        ckMsg.textContent =
          files.length < chunks.length
            ? `assigned ${files.length} of ${chunks.length} — drop ${chunks.length - files.length} more`
            : fresh
              ? `${chunks.length} chunk${chunks.length === 1 ? "" : "s"}, one per image`
              : `assigned ${chunks.length} image${chunks.length === 1 ? "" : "s"}`;
        renderChunks();
      }

      // load a chunk into the trim + image slots so ▶ previews it and `encode`
      // renders that one cartridge
      function selectChunk(i) {
        const c = chunks[i];
        if (!c || !encAudioBuf) return;
        chunkSel = i;
        trimAbsS = c.s;
        trimAbsE = c.e;
        zoomS.value = "0";
        zoomE.value = String(DR_MAX);
        zoomF0 = 0;
        zoomF1 = 1;
        updateZoomFill();
        syncTrimSlidersFromAbsolute();
        updateTimeDisplay();
        stopPreview();
        const f = c.image && droppedFiles.get(c.image);
        if (f) onImageFile(f);
        renderChunks();
        drawWaveforms();
      }

      function renderChunks() {
        if (!ckList) return;
        chunksSection.classList.toggle("on", !!encAudioBuf);
        ckCount.textContent = String(chunks.length);
        ckList.innerHTML = "";
        const files = coverFiles();
        const missing = chunks.filter((c) => !c.image).length;
        chunks.forEach((c, i) => {
          const row = document.createElement("div");
          row.className = "chunk-row" + (i === chunkSel ? " sel" : "");
          const sec = Math.max(0, c.e - c.s);
          const mp = chunkMegapixels(sec);
          const opts =
            `<option value="">— image —</option>` +
            files
              .map(
                (f) =>
                  `<option value="${escHtml(f.name)}"${f.name === c.image ? " selected" : ""}>${escHtml(f.name)}</option>`,
              )
              .join("") +
            // a name from a loaded job whose file hasn't been dropped yet
            (c.image && !files.some((f) => f.name === c.image)
              ? `<option value="${escHtml(c.image)}" selected>${escHtml(c.image)} (missing)</option>`
              : "");
          row.innerHTML =
            `<span class="ck-idx" title="select — preview and encode this chunk">${String(i + 1).padStart(2, "0")}</span>` +
            `<input type="number" class="ck-s" step="1" value="${Math.round(c.s * 1000)}" title="start (ms)">` +
            `<input type="number" class="ck-e" step="1" value="${Math.round(c.e * 1000)}" title="end (ms)">` +
            `<span class="ck-dur">${sec.toFixed(2)}s</span>` +
            `<span class="ck-size${mp > 16.7 ? " over" : ""}" title="${mp > 16.7 ? "over the ~16.7 MP Safari/iOS canvas cap" : "estimated output size"}">${mp.toFixed(1)}MP</span>` +
            `<select class="ck-img${c.image ? "" : " miss"}">${opts}</select>` +
            `<input type="text" class="ck-out" value="${escHtml(c.out)}" placeholder="out (opt)">` +
            `<button class="ck-txt${c.entries.length ? " has" : ""}">text ${c.entries.length || ""}</button>` +
            `<button class="ck-rm">✕</button>`;

          row.querySelector(".ck-idx").addEventListener("click", () => selectChunk(i));
          row.querySelector(".ck-s").addEventListener("change", (e) => {
            c.s = Math.max(0, (parseFloat(e.target.value) || 0) / 1000);
            if (c.s > c.e) c.s = c.e;
            renderChunks();
            drawWaveforms();
          });
          row.querySelector(".ck-e").addEventListener("change", (e) => {
            c.e = Math.max(0, (parseFloat(e.target.value) || 0) / 1000);
            if (c.e < c.s) c.e = c.s;
            renderChunks();
            drawWaveforms();
          });
          row.querySelector(".ck-img").addEventListener("change", (e) => {
            c.image = e.target.value;
            renderChunks();
          });
          row.querySelector(".ck-out").addEventListener("change", (e) => {
            c.out = e.target.value.trim();
          });
          row.querySelector(".ck-txt").addEventListener("click", () => {
            c.open = !c.open;
            renderChunks();
          });
          row.querySelector(".ck-rm").addEventListener("click", () => {
            chunks.splice(i, 1);
            if (chunkSel === i) chunkSel = -1;
            renderChunks();
            drawWaveforms();
          });
          ckList.appendChild(row);

          // per-chunk text entries — these ride along with this cover only;
          // the shared `entries` list below the waveform goes on every chunk
          const box = document.createElement("div");
          box.className = "chunk-entries" + (c.open ? " open" : "");
          const add = document.createElement("button");
          add.textContent = "+ text";
          add.style.alignSelf = "flex-start";
          add.addEventListener("click", () => {
            c.entries.push({ name: "", text: "" });
            c.open = true;
            renderChunks();
          });
          c.entries.forEach((ent, ei) => {
            const er = document.createElement("div");
            er.className = "addl-row";
            er.innerHTML =
              `<input type="text" class="addl-nm" style="width:80px" placeholder="name (opt)" value="${escHtml(ent.name)}">` +
              `<textarea class="addl-ta" rows="2" placeholder="text content"></textarea>` +
              `<button class="addl-rm">✕</button>`;
            er.querySelector(".addl-ta").value = ent.text;
            er.querySelector(".addl-nm").addEventListener("change", (e) => {
              ent.name = e.target.value.trim();
            });
            er.querySelector(".addl-ta").addEventListener("input", (e) => {
              ent.text = e.target.value;
            });
            er.querySelector(".addl-rm").addEventListener("click", () => {
              c.entries.splice(ei, 1);
              renderChunks();
            });
            box.appendChild(er);
          });
          box.appendChild(add);
          ckList.appendChild(box);
        });
        if (!chunks.length) {
          // covers loaded but nothing chunked yet — say what the next move is,
          // since an empty chunk list otherwise looks like nothing happened
          if (files.length)
            ckMsg.textContent = `${files.length} image${files.length === 1 ? "" : "s"} ready · "↧ images" makes one chunk each`;
        } else if (!ckMsg.textContent) {
          ckMsg.textContent = missing
            ? `${missing} chunk${missing === 1 ? "" : "s"} still need an image`
            : "";
        }
      }

      document.getElementById("ckEvenBtn").addEventListener("click", () => {
        ckMsg.textContent = "";
        makeEqualChunks(parseInt(ckEvery.value) || 1);
      });
      document.getElementById("ckFitBtn").addEventListener("click", () => {
        ckMsg.textContent = "";
        fitChunks(parseFloat(ckMaxMp.value) || 16);
        ckEvery.value = String(chunks.length);
      });
      document.getElementById("ckSplitBtn").addEventListener("click", splitAtCaret);
      document.getElementById("ckImgBtn").addEventListener("click", autoAssignCovers);
      document.getElementById("ckClearBtn").addEventListener("click", () => {
        chunks = [];
        chunkSel = -1;
        seriesWin = null;
        ckMsg.textContent = "";
        renderChunks();
        drawWaveforms();
      });
      document.getElementById("ckCopyBtn").addEventListener("click", async () => {
        if (!chunks.length) {
          ckMsg.textContent = "no chunks yet";
          return;
        }
        const payload =
          ckJsonKind.value === "array"
            ? gatherChunkJobs()
            : [gatherChunkSplit()];
        const ok = await copyText(JSON.stringify(payload, null, 2));
        ckMsg.textContent = ok
          ? `copied ${payload.length} ${ckJsonKind.value === "array" ? "jobs" : "split job"} ✓`
          : "copy failed";
      });

      // a loaded job's `split` block → chunk rows (the inverse of
      // gatherChunkSplit). Windows come from the job schema's planner, so an auto
      // split (count/chunk/maxPixels) lands on exactly the batch boundaries.
      function applySplitToChunks(spec) {
        const durMs = encAudioBuf ? encAudioBuf.duration * 1000 : null;
        let windows;
        try {
          windows = StegassetteJobs.planChunks(spec, {
            durationMs: durMs,
            srcSr: encAudioBuf ? encAudioBuf.sampleRate : null,
            bytesPerPixel: uiBytesPerPixel(),
          });
        } catch (e) {
          // an open-ended split can't be laid out until its audio is decoded
          ckMsg.textContent = "✗ " + e.message;
          return;
        }
        const parts = Array.isArray(spec.parts) ? spec.parts : [];
        const images = Array.isArray(spec.images) ? spec.images : [];
        chunks = windows.map((w, i) => {
          const p = parts[i] || {};
          const c = mkChunk(w.start / 1000, w.end / 1000);
          c.image = baseName(p.image ?? images[i] ?? spec.image ?? "");
          c.out = p.out || "";
          c.name = p.name || "";
          c.entries = (Array.isArray(p.entries) ? p.entries : []).map((e) => ({
            name: e.name || "",
            text: e.text || "",
          }));
          return c;
        });
        seriesWin = {
          s: (Number(spec.start) || 0) / 1000,
          e: (spec.end != null ? Number(spec.end) : durMs || 0) / 1000,
        };
        chunkSel = -1;
        ckEvery.value = String(chunks.length);
        ckMsg.textContent = "";
        renderChunks();
        drawWaveforms();
      }

      // reorganize the encoder into a roomy main column + a controls sidebar.
      // sidebar: jobs queue + audio/steg settings + encode action.
      // main: drops, waveform, entries, and the player/preview inline.
      // Moving nodes keeps all IDs/listeners intact.
      (function buildEncoderLayout() {
        const sec = document.getElementById("encSection");
        const settings = sec.querySelector(".settings-panel");
        const actionRow = sec.querySelector(".action-row");
        const player = document.getElementById("playerSection");
        const layout = document.createElement("div");
        layout.className = "enc-layout";
        const main = document.createElement("div");
        main.className = "enc-main";
        const side = document.createElement("aside");
        side.className = "enc-side";
        while (sec.firstChild) main.appendChild(sec.firstChild);
        side.appendChild(jobsPanel); // jobs on top of the sidebar
        side.appendChild(settings); // then audio + steg groups (stacked)
        side.appendChild(actionRow); // encode action at the bottom
        if (player) main.appendChild(player); // player/preview takes its place
        layout.appendChild(main);
        layout.appendChild(side);
        sec.appendChild(layout);
      })();

      eAspect.addEventListener("change", () => {
        eAspectCustom.style.display =
          eAspect.value === "custom" ? "flex" : "none";
      });

      // ── video frame picker ────────────────────────────────────────────

      function onVideoFileLoaded(file) {
        encImgFile = null;
        encFrameCanvases = [];
        encVideoFile = file;
        encAudioName = file.name;
        renderFrameThumbs();
        if (encFrameBlobUrl) URL.revokeObjectURL(encFrameBlobUrl);
        encFrameBlobUrl = URL.createObjectURL(file);
        frameVideoEl.src = encFrameBlobUrl;
        frameVideoEl.load();
        idrop.innerHTML = `<span class="drop__label">${escHtml(file.name)}</span><span class="drop__sub">video</span>`;
        idrop.setAttribute("data-ready", "");
        estats.textContent = "extracting audio from video…";
        if (!encActx) encActx = new AudioContext();
        encActx.resume().then(() => {
          file.arrayBuffer().then((buf) => {
            encActx.decodeAudioData(
              buf,
              (audioBuf) => {
                encAudioBuf = audioBuf;
                const d = audioBuf.duration;
                adrop.innerHTML = `<span class="drop__label">${escHtml(file.name)}</span><span class="drop__sub">${audioBuf.sampleRate}Hz · ${audioBuf.numberOfChannels}ch · ${d.toFixed(2)}s · video audio</span>`;
                adrop.setAttribute("data-ready", "");
                estats.textContent = "";
                onAudioLoaded();
              },
              () => {
                estats.textContent =
                  "no audio track — drop an audio file separately";
              },
            );
          });
        });
        checkEncReady();
      }

      // timestamps from a loaded job's `frames.at`, grabbed once the video is
      // decodable (a job can be selected before its video has been dropped)
      let pendingFrames = null;
      function seekFrameVideo(t) {
        return new Promise((res) => {
          const on = () => {
            frameVideoEl.removeEventListener("seeked", on);
            res();
          };
          frameVideoEl.addEventListener("seeked", on);
          frameVideoEl.currentTime = Math.max(
            0,
            Math.min(frameVideoEl.duration || 0, t),
          );
        });
      }
      async function captureFramesAt(list) {
        pendingFrames = null;
        encFrameCanvases = [];
        for (const ms of list) {
          await seekFrameVideo(ms / 1000);
          captureCurrentFrame();
        }
      }

      frameVideoEl.addEventListener("loadedmetadata", () => {
        vScrubT = 0;
        vScrub.value = "0";
        framePickerSection.classList.add("on");
        frameVideoEl.currentTime = 0;
        if (pendingFrames) captureFramesAt(pendingFrames);
      });
      frameVideoEl.addEventListener("seeked", () => {
        const vW = frameVideoEl.videoWidth,
          vH = frameVideoEl.videoHeight;
        if (!vW || !vH) return;
        framePreviewEl.width = vW;
        framePreviewEl.height = vH;
        framePreviewEl.getContext("2d").drawImage(frameVideoEl, 0, 0, vW, vH);
        vScrubT = frameVideoEl.currentTime;
        vTimeEl.textContent = vScrubT.toFixed(3) + "s";
        drawWaveforms();
      });
      vScrub.addEventListener("input", () => {
        if (!encAudioBuf) return;
        const winDur = trimAbsE - trimAbsS;
        const t =
          winDur > 0 ? trimAbsS + (+vScrub.value / DR_MAX) * winDur : trimAbsS;
        frameVideoEl.currentTime = Math.max(
          0,
          Math.min(frameVideoEl.duration, t),
        );
      });
      function clampScrubToTrim() {
        if (!encVideoFile || !encAudioBuf) return;
        const winDur = trimAbsE - trimAbsS;
        if (winDur <= 0) return;
        vScrubT = Math.max(trimAbsS, Math.min(trimAbsE, vScrubT));
        vScrub.value = String(
          Math.round(((vScrubT - trimAbsS) / winDur) * DR_MAX),
        );
        frameVideoEl.currentTime = vScrubT;
      }
      function captureCurrentFrame() {
        const vW = frameVideoEl.videoWidth,
          vH = frameVideoEl.videoHeight;
        if (!vW || !vH) return;
        const cap = Object.assign(document.createElement("canvas"), {
          width: vW,
          height: vH,
        });
        cap.getContext("2d").drawImage(frameVideoEl, 0, 0, vW, vH);
        encFrameCanvases.push({ canvas: cap, time: frameVideoEl.currentTime });
        renderFrameThumbs();
        checkEncReady();
      }
      captureFrameBtn.addEventListener("click", captureCurrentFrame);
      clearFramesBtn.addEventListener("click", () => {
        encFrameCanvases = [];
        renderFrameThumbs();
        checkEncReady();
      });
      function renderFrameThumbs() {
        frameThumbsEl.innerHTML = "";
        const n = encFrameCanvases.length;
        clearFramesBtn.style.display = n > 0 ? "" : "none";
        for (let i = 0; i < n; i++) {
          const { canvas, time } = encFrameCanvases[i];
          const thumb = document.createElement("div");
          thumb.className = "frame-thumb";
          const img = document.createElement("img");
          img.src = canvas.toDataURL("image/jpeg", 0.7);
          const del = document.createElement("button");
          del.className = "frame-thumb-del";
          del.textContent = "✕";
          del.addEventListener("click", () => {
            encFrameCanvases.splice(i, 1);
            renderFrameThumbs();
            checkEncReady();
          });
          const num = document.createElement("span");
          num.className = "frame-thumb-num";
          num.textContent = time.toFixed(2) + "s";
          thumb.appendChild(img);
          thumb.appendChild(del);
          thumb.appendChild(num);
          frameThumbsEl.appendChild(thumb);
        }
      }
      function composeMosaic(frames, layout) {
        const cellW = frames[0].canvas.width,
          cellH = frames[0].canvas.height;
        // shared with the batch encoder so a `frames` job tiles identically
        const { cols, rows } = StegassetteJobs.mosaicGrid(frames.length, layout);
        const cnv = Object.assign(document.createElement("canvas"), {
          width: cellW * cols,
          height: cellH * rows,
        });
        const ctx = cnv.getContext("2d");
        for (let i = 0; i < cols * rows && i < frames.length; i++)
          ctx.drawImage(
            frames[i].canvas,
            (i % cols) * cellW,
            Math.floor(i / cols) * cellH,
            cellW,
            cellH,
          );
        return cnv;
      }

      // ── traversal params ──────────────────────────────────────────────

      function mkLabel(text) {
        const el = document.createElement("label");
        el.textContent = text;
        return el;
      }
      function mkNumInput(id, val, min, step) {
        const el = document.createElement("input");
        el.type = "number";
        el.id = id;
        el.value = val;
        if (min != null) el.min = min;
        if (step != null) el.step = step;
        el.style.cssText = "width:52px";
        return el;
      }
      function updateTravParams() {
        const t = eTraversal.value;
        travParams.innerHTML = "";
        if (t === "angle") {
          travParams.style.display = "contents";
          travParams.appendChild(mkLabel("a"));
          travParams.appendChild(mkNumInput("eangle-a", 1, null, 1));
          travParams.appendChild(mkLabel("b"));
          travParams.appendChild(mkNumInput("eangle-b", 1, null, 1));
        } else if (t === "fisher-yates") {
          travParams.style.display = "contents";
          travParams.appendChild(mkLabel("seed"));
          const inp = mkNumInput("eFySeed", "", null, 1);
          inp.placeholder = "random";
          inp.style.width = "80px";
          travParams.appendChild(inp);
        } else {
          travParams.style.display = "none";
        }
      }
      eTraversal.addEventListener("change", updateTravParams);
      updateTravParams();

      // A keyless keymap generates its key from position instead of reading a
      // pixel, so nothing is held back and every interior pixel carries payload.
      //
      // A function declaration, not a const arrow, on purpose: renderChanPlan()
      // runs during init — hundreds of lines above this one — and calls
      // updateCombineAvailability, which calls this. A const would still be in
      // its temporal dead zone at that point, and the ReferenceError would abort
      // the rest of this script, silently leaving every later listener unbound.
      function isKeyless(km) {
        return Stegassette.KEYLESS_KEYMAPS.has(km);
      }

      const keymapParams = document.getElementById("keymapParams");
      function updateKeymapParams() {
        keymapParams.innerHTML = "";
        if (eKeymap.value === "offset") {
          keymapParams.style.display = "contents";
          keymapParams.appendChild(mkLabel("kx"));
          keymapParams.appendChild(mkNumInput("ekx", 0, null, 1));
          keymapParams.appendChild(mkLabel("ky"));
          keymapParams.appendChild(mkNumInput("eky", 0, null, 1));
        } else {
          keymapParams.style.display = "none";
        }
      }
      eKeymap.addEventListener("change", updateKeymapParams);
      updateKeymapParams();

      // Combines that rewrite the key pixel need a key pixel to write to.
      // Disable rather than hide, so the option list stays the same shape and
      // it is visible *why* a choice went away.
      function updateCombineAvailability() {
        const keyless = isKeyless(eKeymap.value);
        document
          .querySelectorAll("#eAllCombine option, .cr-cm option")
          .forEach((opt) => {
            // The channel-plan rows render options with no value attribute, so
            // value falls through to the label — pin it before relabelling, or
            // the annotation below silently becomes the option's value.
            const name = opt.value;
            opt.value = name;
            const blocked = keyless && !!Stegassette.KEY_MOD[name];
            opt.disabled = blocked;
            opt.textContent = blocked ? `${name} — needs a key pixel` : name;
          });
        // Anything already selected that just became invalid falls back to xor.
        let changed = false;
        document.querySelectorAll("#eAllCombine, .cr-cm").forEach((sel) => {
          if (keyless && Stegassette.KEY_MOD[sel.value]) {
            sel.value = "xor";
            changed = true;
          }
        });
        if (changed) {
          for (const s of chanPlan)
            if (Stegassette.KEY_MOD[s.combine]) s.combine = "xor";
          eAllCombine.value = chanPlan[0].combine;
          // Deliberately not calling updateReconLabel() here: it closes over
          // consts declared below, and this runs during init from
          // renderChanPlan. The keymap 'change' listener already calls it, and
          // is attached after this one, so it sees the corrected plan.
        }
      }
      eKeymap.addEventListener("change", updateCombineAvailability);

      // These ops keep the key pixel intact, so the player can reconstruct from
      // real pixels at half resolution.
      const KEY_PRESERVING_COMBINES = Stegassette.KEY_PRESERVING;
      // Quality hints for the *full-res per-pair* path — only reached when no
      // channel is key-preserving (pure difference/noise/echo).
      // A lossy path is marked with weight, not hue (amplib-ui has no colour).
      const RECON_QUALITY = {
        difference: (km) =>
          km === "adjacent"
            ? { text: "recon: near-lossless" }
            : { text: "recon: approximate", warn: true },
        noise: () => ({ text: "recon: destructive", warn: true }),
        echo: (km) =>
          km === "adjacent"
            ? { text: "recon: key-exact ghost" }
            : { text: "recon: key-exact mirror ghost" },
      };
      // Label follows the actual recon path the player will take for this plan.
      function updateReconLabel() {
        // Keyless outranks the combine: with no key pixel there is nothing
        // holding a cover value, so no combine can make the image recoverable.
        if (isKeyless(eKeymap.value)) {
          // Keyless has no key pixel, so no combine can bring the cover back —
          // but a channel left OUT of the plan is never written at all, and
          // survives at full resolution. That is the only picture such an
          // encode has, and it is worth naming.
          const carrying = new Set(chanPlan.map((s) => s.ch));
          const kept = ["r", "g", "b"].filter((c) => !carrying.has(c));
          reconLabel.textContent = kept.length
            ? `recon: full-res (${kept.join("+").toUpperCase()} real) · ½ area`
            : "recon: none — keyless, all channels carry · ½ area";
          reconLabel.toggleAttribute("data-warn", !kept.length);
          return;
        }
        const combines = chanPlan.map((s) => s.combine);
        const allKP = combines.every((c) => KEY_PRESERVING_COMBINES.has(c));
        const someKP = combines.some((c) => KEY_PRESERVING_COMBINES.has(c));
        let text, warn;
        if (allKP) {
          // every channel keeps its key pixel → half-res image of true cover px
          ({ text, warn } = { text: "recon: ½-res (real px)" });
        } else if (someKP) {
          // mixed: full-res per-pair pass decimated to half-res (all real/restored)
          ({ text, warn } = { text: "recon: ½-res (mixed)" });
        } else {
          // pure difference/noise/echo → full-res per-pair reconstruction
          const q = RECON_QUALITY[representativeCombine()];
          if (!q) {
            reconLabel.textContent = "";
            return;
          }
          ({ text, warn } = q(eKeymap.value));
        }
        reconLabel.textContent = text;
        reconLabel.toggleAttribute("data-warn", !!warn);
      }
      eKeymap.addEventListener("change", updateReconLabel);
      updateReconLabel();

      // ── dropzones ────────────────────────────────────────────────────

      // Every file that lands on a dropzone is also stashed by filename, so a
      // multi-image drop in series mode fills the per-chunk cover pickers (and
      // jobs can still auto-attach). The first one loads into the slot.
      function wireDropzone(zone, input, onFile) {
        const take = (list) => {
          const files = [...(list || [])];
          files.forEach(stashDroppedFile);
          if (files[0]) onFile(files[0]);
        };
        zone.addEventListener("click", () => input.click());
        input.addEventListener("change", (e) => take(e.target.files));
        zone.addEventListener("dragover", (e) => {
          e.preventDefault();
          zone.dataset.state = "over";
        });
        zone.addEventListener("dragleave", () => delete zone.dataset.state);
        zone.addEventListener("drop", (e) => {
          e.preventDefault();
          delete zone.dataset.state;
          take(e.dataTransfer.files);
        });
      }

      function onImageFile(file) {
        encImgFile = file;
        encFrameCanvases = [];
        encVideoFile = null;
        framePickerSection.classList.remove("on");
        idrop.innerHTML = `<span class="drop__label">${escHtml(file.name)}</span><span class="drop__sub">image</span>`;
        idrop.setAttribute("data-ready", "");
        checkEncReady();
      }

      function onAudioFile(file) {
        encAudioName = file.name;
        estats.textContent = "decoding audio…";
        if (!encActx) encActx = new AudioContext();
        encActx.resume().then(() => {
          file.arrayBuffer().then((buf) => {
            encActx.decodeAudioData(
              buf,
              (audioBuf) => {
                encAudioBuf = audioBuf;
                const d = audioBuf.duration;
                adrop.innerHTML = `<span class="drop__label">${file.name}</span><span class="drop__sub">${audioBuf.sampleRate}Hz · ${audioBuf.numberOfChannels}ch · ${d.toFixed(2)}s</span>`;
                adrop.setAttribute("data-ready", "");
                estats.textContent = "";
                onAudioLoaded();
              },
              () => {
                estats.textContent = "✗ could not decode audio";
              },
            );
          });
        });
      }

      wireDropzone(idrop, ifi, (file) => {
        if (file.type.startsWith("video/")) onVideoFileLoaded(file);
        else onImageFile(file);
      });
      wireDropzone(adrop, afi, onAudioFile);

      function onAudioLoaded() {
        const dur = encAudioBuf.duration;
        trimAbsS = 0;
        trimAbsE = dur;
        zoomF0 = 0;
        zoomF1 = 1;
        zoomS.value = "0";
        zoomE.value = String(DR_MAX);
        trimS.value = "0";
        trimE.value = String(DR_MAX);
        eSrEl.value = encAudioBuf.sampleRate;
        eChEl.value = encAudioBuf.numberOfChannels >= 2 ? "2" : "1";
        updateLayoutVisibility();
        waveSection.classList.add("on");
        updateZoomFill();
        updateTrimFill();
        updateTimeDisplay();
        updateSpeedHint();
        // new source → the old chunk boundaries mean nothing
        chunks = [];
        chunkSel = -1;
        seriesWin = null;
        seriesCaret = null;
        ckMsg.textContent = "";
        renderChunks();
        requestAnimationFrame(() => drawWaveforms());
        checkEncReady();
        // a job auto-attached this audio — restore its settings/trim on top of
        // the natural reset above (decode resets sr/ch/trim to the file's values)
        if (pendingJobConfig) {
          const j = pendingJobConfig;
          pendingJobConfig = null;
          applyConfig(j);
        }
      }

      // ── zoom dual-range ───────────────────────────────────────────────

      function updateZoomFill() {
        const s = +zoomS.value / DR_MAX,
          e = +zoomE.value / DR_MAX;
        zoomFill.style.left = s * 100 + "%";
        zoomFill.style.width = (e - s) * 100 + "%";
        zoomF0 = s;
        zoomF1 = e;
        const atMax = +zoomE.value >= DR_MAX;
        zoomS.style.zIndex = atMax ? 2 : 1;
        zoomE.style.zIndex = atMax ? 1 : 2;
      }
      function syncTrimSlidersFromAbsolute() {
        if (!encAudioBuf) return;
        const dur = encAudioBuf.duration;
        const winS = zoomF0 * dur,
          winE = zoomF1 * dur,
          winDur = winE - winS;
        if (winDur <= 0) return;
        const ts = Math.max(
          0,
          Math.min(DR_MAX, Math.round(((trimAbsS - winS) / winDur) * DR_MAX)),
        );
        const te = Math.max(
          0,
          Math.min(DR_MAX, Math.round(((trimAbsE - winS) / winDur) * DR_MAX)),
        );
        trimS.value = String(ts);
        trimE.value = String(te);
        updateTrimFill();
      }
      zoomS.addEventListener("input", () => {
        if (+zoomS.value > +zoomE.value) zoomS.value = zoomE.value;
        updateZoomFill();
        syncTrimSlidersFromAbsolute();
        drawWaveforms();
      });
      zoomE.addEventListener("input", () => {
        if (+zoomE.value < +zoomS.value) zoomE.value = zoomS.value;
        updateZoomFill();
        syncTrimSlidersFromAbsolute();
        drawWaveforms();
      });

      // ── trim dual-range ───────────────────────────────────────────────

      function updateTrimFill() {
        const s = +trimS.value / DR_MAX,
          e = +trimE.value / DR_MAX;
        trimFill.style.left = s * 100 + "%";
        trimFill.style.width = (e - s) * 100 + "%";
        const atMax = +trimE.value >= DR_MAX;
        trimS.style.zIndex = atMax ? 2 : 1;
        trimE.style.zIndex = atMax ? 1 : 2;
      }
      function syncAbsoluteFromTrimSliders() {
        if (!encAudioBuf) return;
        const dur = encAudioBuf.duration;
        const winS = zoomF0 * dur,
          winE = zoomF1 * dur,
          winDur = winE - winS;
        trimAbsS = winS + (+trimS.value / DR_MAX) * winDur;
        trimAbsE = winS + (+trimE.value / DR_MAX) * winDur;
        updateTimeDisplay();
      }
      trimS.addEventListener("input", () => {
        if (+trimS.value > +trimE.value) trimS.value = trimE.value;
        updateTrimFill();
        syncAbsoluteFromTrimSliders();
        clampScrubToTrim();
        drawWaveforms();
        if (prevSrc) stopPreview();
      });
      trimE.addEventListener("input", () => {
        if (+trimE.value < +trimS.value) trimE.value = trimS.value;
        updateTrimFill();
        syncAbsoluteFromTrimSliders();
        clampScrubToTrim();
        drawWaveforms();
        if (prevSrc) stopPreview();
      });

      // ── time number inputs ────────────────────────────────────────────

      function updateTimeDisplay() {
        // inputs are in ms to match the config JSON (trimAbsS/E stay in seconds)
        trimStartN.value = Math.round(trimAbsS * 1000);
        trimEndN.value = Math.round(trimAbsE * 1000);
        trimDurEl.textContent =
          Math.round((trimAbsE - trimAbsS) * 1000) + "ms";
        updateSizeHint();
      }
      function applyManualTrim() {
        if (!encAudioBuf) return;
        const dur = encAudioBuf.duration;
        let s = (parseFloat(trimStartN.value) || 0) / 1000,
          e = (parseFloat(trimEndN.value) || 0) / 1000;
        s = Math.max(0, Math.min(dur, s));
        e = Math.max(0, Math.min(dur, e));
        if (s > e) s = e;
        trimAbsS = s;
        trimAbsE = e;
        zoomS.value = "0";
        zoomE.value = String(DR_MAX);
        zoomF0 = 0;
        zoomF1 = 1;
        updateZoomFill();
        syncTrimSlidersFromAbsolute();
        updateTimeDisplay();
        clampScrubToTrim();
        drawWaveforms();
      }
      trimStartN.addEventListener("change", applyManualTrim);
      trimEndN.addEventListener("change", applyManualTrim);

      // ── speed/size hints ──────────────────────────────────────────────

      function updateSpeedHint() {
        if (!encAudioBuf) {
          speedHint.textContent = "";
          return;
        }
        const srcSr = encAudioBuf.sampleRate,
          tgtSr = parseInt(eSrEl.value) || srcSr;
        if (eModeEl.value === "resample" || tgtSr === srcSr) {
          speedHint.textContent = "";
          return;
        }
        const ratio = tgtSr / srcSr;
        const pct = (ratio * 100).toFixed(0);
        const st = (12 * Math.log2(ratio)).toFixed(1);
        speedHint.textContent = `→ ${pct}% speed  ${+st > 0 ? "+" : ""}${st}st`;
      }
      function updateSizeHint() {
        if (!encAudioBuf) {
          sizeHint.textContent = "";
          return;
        }
        const dur = trimAbsE - trimAbsS;
        if (dur <= 0) {
          sizeHint.textContent = "";
          return;
        }
        const srcSr = encAudioBuf.sampleRate;
        const tgtSr = Math.max(
          1000,
          Math.min(65535, parseInt(eSrEl.value) || srcSr),
        );
        const tgtCh = parseInt(eChEl.value) || 1;
        const tgtBit = parseInt(eBitsEl.value) || 16;
        const doResamp = eModeEl.value === "resample";
        const frames = Math.round(dur * (doResamp ? tgtSr : srcSr));
        const audioBytes = frames * tgtCh * (tgtBit >> 3);
        const audioMime = Stegassette.buildAudioMime({
          bits: tgtBit,
          rate: tgtSr,
          channels: tgtCh,
        });
        const mtLen = new TextEncoder().encode(audioMime).length;
        const totalInterior = 2 + mtLen + 2 + 0 + 4 + audioBytes;
        const totalPx = Math.ceil(totalInterior / 3) * 2;
        const kb = (audioBytes / 1024).toFixed(0);
        const srNote =
          !doResamp && tgtSr !== srcSr ? `  [src ${srcSr} Hz]` : "";
        sizeHint.textContent = `~${kb} KB  ·  ~${totalPx.toLocaleString()} img px${srNote}`;
      }

      function updateLayoutVisibility() {
        const isMono = parseInt(eChEl.value) === 1;
        eLayoutWrap.style.display = isMono ? "none" : "";
        eBlockSizeEl.style.display = eLayoutEl.value === "block" ? "" : "none";
      }
      eChEl.addEventListener("change", updateLayoutVisibility);
      eLayoutEl.addEventListener("change", updateLayoutVisibility);
      updateLayoutVisibility();

      for (const el of [
        eSrEl,
        eChEl,
        eBitsEl,
        eDirEl,
        eModeEl,
        eLayoutEl,
        eBlockSizeEl,
      ]) {
        el.addEventListener("input", () => {
          updateSpeedHint();
          updateSizeHint();
        });
        el.addEventListener("change", () => {
          updateSpeedHint();
          updateSizeHint();
        });
      }

      // ── waveform drawing ──────────────────────────────────────────────

      function drawChannel(
        ctx,
        data,
        startSamp,
        endSamp,
        W,
        H,
        trimXS,
        trimXE,
        playX,
      ) {
        const step = (endSamp - startSamp) / W,
          amp = H / 2;
        ctx.clearRect(0, 0, W, H);
        for (let i = 0; i < W; i++) {
          let mn = 1,
            mx = -1;
          const s0 = Math.floor(startSamp + i * step),
            s1 = Math.max(s0 + 1, Math.floor(startSamp + (i + 1) * step));
          for (let j = s0; j < Math.min(s1, data.length); j++) {
            if (data[j] < mn) mn = data[j];
            if (data[j] > mx) mx = data[j];
          }
          if (mn > mx) {
            if (s0 < data.length) {
              mn = mx = data[s0];
            } else continue;
          }
          const inTrim = i >= trimXS && i <= trimXE;
          ctx.fillStyle = inTrim ? "#999" : "#2e2e2e";
          ctx.fillRect(i, (1 + mn) * amp, 1, Math.max(1, (mx - mn) * amp));
        }
        ctx.fillStyle = "rgba(0,0,0,0.55)";
        if (trimXS > 0) ctx.fillRect(0, 0, trimXS, H);
        if (trimXE < W) ctx.fillRect(trimXE, 0, W - trimXE, H);
        if (playX !== undefined) {
          ctx.fillStyle = "#fff";
          ctx.fillRect(Math.round(playX), 0, 1, H);
        }
      }
      function drawWaveforms(playbackTime) {
        if (!encAudioBuf) return;
        const dur = encAudioBuf.duration,
          data = encAudioBuf.getChannelData(0),
          sr = encAudioBuf.sampleRate,
          total = data.length;
        {
          const W = (waveCoarse.width = waveCoarse.clientWidth || 600),
            H = (waveCoarse.height = waveCoarse.clientHeight || 52);
          const ctx = waveCoarse.getContext("2d");
          const trimXS = (trimAbsS / dur) * W,
            trimXE = (trimAbsE / dur) * W;
          const playX =
            playbackTime !== undefined ? (playbackTime / dur) * W : undefined;
          drawChannel(ctx, data, 0, total, W, H, trimXS, trimXE, playX);
          drawChunkOverlay(ctx, W, H, 0, dur, (t) => (t / dur) * W);
          const zxS = zoomF0 * W,
            zxE = zoomF1 * W;
          ctx.fillStyle = "rgba(255,255,255,0.08)";
          ctx.fillRect(zxS, 0, zxE - zxS, H);
          ctx.fillStyle = "rgba(255,255,255,0.5)";
          ctx.fillRect(zxS, 0, 1, H);
          ctx.fillRect(zxE - 1, 0, 1, H);
        }
        {
          const W = (waveFine.width = waveFine.clientWidth || 600),
            H = (waveFine.height = waveFine.clientHeight || 72);
          const ctx = waveFine.getContext("2d");
          const winS = zoomF0 * dur,
            winE = zoomF1 * dur,
            winDur = winE - winS;
          const startSamp = Math.floor(winS * sr),
            endSamp = Math.floor(winE * sr);
          let trimXS = 0,
            trimXE = W;
          if (winDur > 0) {
            trimXS = ((trimAbsS - winS) / winDur) * W;
            trimXE = ((trimAbsE - winS) / winDur) * W;
          }
          let playX;
          if (
            playbackTime !== undefined &&
            winDur > 0 &&
            playbackTime >= winS &&
            playbackTime <= winE
          )
            playX = ((playbackTime - winS) / winDur) * W;
          drawChannel(
            ctx,
            data,
            startSamp,
            endSamp,
            W,
            H,
            trimXS,
            trimXE,
            playX,
          );
          if (
            encVideoFile &&
            winDur > 0 &&
            vScrubT >= trimAbsS &&
            vScrubT <= trimAbsE
          ) {
            const scrubX = Math.round(((vScrubT - winS) / winDur) * W);
            if (scrubX >= 0 && scrubX <= W) {
              ctx.fillStyle = "rgba(255,255,255,0.9)";
              ctx.fillRect(scrubX, 0, 1, H);
            }
          }
          if (winDur > 0)
            drawChunkOverlay(ctx, W, H, winS, winDur, (t) =>
              t >= winS && t <= winE ? ((t - winS) / winDur) * W : null,
            );
        }
      }

      // chunk boundaries drawn over both waveforms in series mode: banded
      // regions, numbered, with the caret "÷ at caret" would cut at.
      function drawChunkOverlay(ctx, W, H, winS, winDur, toX) {
        if (encMode !== "series") return;
        chunks.forEach((c, i) => {
          const x0 = Math.max(0, toX(Math.max(c.s, winS)) ?? 0);
          const x1 = Math.min(W, toX(Math.min(c.e, winS + winDur)) ?? W);
          if (!(x1 > x0)) return;
          ctx.fillStyle =
            i === chunkSel ? "rgba(255,255,255,0.18)" : i % 2 ? "rgba(255,255,255,0.045)" : "rgba(255,255,255,0.012)";
          ctx.fillRect(x0, 0, x1 - x0, H);
          ctx.fillStyle = i === chunkSel ? "rgba(255,255,255,0.9)" : "rgba(255,255,255,0.35)";
          ctx.fillRect(x0, 0, 1, H);
          if (x1 - x0 > 16) {
            ctx.fillStyle = i === chunkSel ? "#fff" : "#666";
            ctx.font = "9px monospace";
            ctx.fillText(String(i + 1).padStart(2, "0"), x0 + 3, 9);
          }
        });
        if (seriesCaret != null) {
          const cx = toX(seriesCaret);
          if (cx != null) {
            ctx.fillStyle = "#fff";
            ctx.fillRect(Math.round(cx) - 1, 0, 2, H);
          }
        }
      }

      // ── preview playback ──────────────────────────────────────────────

      function stopPreview() {
        prevGen++;
        if (prevSrc) {
          try {
            prevSrc.stop();
          } catch (_) {}
          prevSrc = null;
        }
        if (prevRaf) {
          cancelAnimationFrame(prevRaf);
          prevRaf = null;
        }
        drawWaveforms();
      }
      function doPreview(startAt = null) {
        if (!encAudioBuf) return;
        const segDur = trimAbsE - trimAbsS;
        if (segDur <= 0) return;
        const offset =
          startAt != null
            ? Math.max(0, Math.min(segDur, startAt - trimAbsS))
            : 0;
        stopPreview();
        const myGen = prevGen;
        encActx.resume().then(() => {
          if (prevGen !== myGen) return;
          const sr = encAudioBuf.sampleRate,
            s0 = Math.floor(trimAbsS * sr),
            s1 = Math.floor(trimAbsE * sr);
          const len = Math.max(1, s1 - s0);
          const slice = encActx.createBuffer(
            encAudioBuf.numberOfChannels,
            len,
            sr,
          );
          for (let c = 0; c < encAudioBuf.numberOfChannels; c++)
            slice.copyToChannel(encAudioBuf.getChannelData(c).slice(s0, s1), c);
          prevSrc = encActx.createBufferSource();
          prevSrc.buffer = slice;
          prevSrc.loop = true;
          prevSrc.connect(encActx.destination);
          prevSrc.start(0, offset);
          const t0wall = encActx.currentTime;
          const animate = () => {
            if (prevGen !== myGen) return;
            const pos =
              trimAbsS + ((encActx.currentTime - t0wall + offset) % segDur);
            drawWaveforms(pos);
            prevRaf = requestAnimationFrame(animate);
          };
          animate();
          prevSrc.onended = () => {
            if (prevGen === myGen) {
              prevSrc = null;
              drawWaveforms();
            }
          };
        });
      }
      prevPlayBtn.addEventListener("click", () => doPreview());
      prevStopBtn.addEventListener("click", stopPreview);

      waveFine.addEventListener("click", (e) => {
        if (!encAudioBuf) return;
        const rect = waveFine.getBoundingClientRect();
        const frac = (e.clientX - rect.left) / rect.width;
        const winS = zoomF0 * encAudioBuf.duration,
          winE = zoomF1 * encAudioBuf.duration;
        const raw = winS + frac * (winE - winS);
        // series mode: a click places the cut caret anywhere in the source
        if (encMode === "series") {
          seriesCaret = Math.max(0, Math.min(encAudioBuf.duration, raw));
          drawWaveforms();
        }
        if (!prevSrc) return;
        doPreview(Math.max(trimAbsS, Math.min(trimAbsE, raw)));
      });

      // ── additional entries ────────────────────────────────────────────

      let addlEntries = [];

      // one mime map for the editor, the batch encoder and the schema helpers
      const mimeFromFilename = StegassetteJobs.mimeFromPath;
      function removeAddlEntry(entry) {
        addlEntries = addlEntries.filter((e) => e !== entry);
        entry.el.remove();
      }

      // create a text entry row, optionally prefilled (used by + text and job load)
      function addTextEntry(name = "", text = "") {
        const entry = {
          mimetype: "text/plain",
          name: name || "",
          data: null,
          isText: true,
          textEl: null,
        };
        const el = document.createElement("div");
        el.className = "addl-row";
        el.innerHTML = `<input type="text" class="addl-mt" value="text/plain" style="width:130px" placeholder="mimetype"><input type="text" class="addl-nm" style="width:80px" placeholder="name (opt)"><textarea class="addl-ta" rows="2" placeholder="text content"></textarea><button class="addl-rm">✕</button>`;
        el.querySelector(".addl-mt").addEventListener("change", (e) => {
          entry.mimetype = e.target.value.trim();
        });
        const nmEl = el.querySelector(".addl-nm");
        nmEl.value = name || "";
        nmEl.addEventListener("change", (e) => {
          entry.name = e.target.value.trim();
        });
        el.querySelector(".addl-rm").addEventListener("click", () =>
          removeAddlEntry(entry),
        );
        entry.el = el;
        entry.textEl = el.querySelector(".addl-ta");
        entry.textEl.value = text || "";
        addlEntries.push(entry);
        addlRows.appendChild(el);
        return entry;
      }
      addTextBtn.addEventListener("click", () => addTextEntry());

      // clear only text entries (leave file/binary entries the user added)
      function clearTextEntries() {
        for (const e of addlEntries.filter((x) => x.isText)) e.el.remove();
        addlEntries = addlEntries.filter((x) => !x.isText);
      }

      addFileBtn.addEventListener("click", () => {
        const fi = document.createElement("input");
        fi.type = "file";
        fi.addEventListener("change", (e) => {
          const file = e.target.files[0];
          if (!file) return;
          file.arrayBuffer().then((buf) => {
            const entry = {
              mimetype: mimeFromFilename(file.name),
              name: file.name,
              data: new Uint8Array(buf),
              isText: false,
            };
            const el = document.createElement("div");
            el.className = "addl-row";
            const sz =
              buf.byteLength < 1024
                ? buf.byteLength + "B"
                : (buf.byteLength / 1024).toFixed(1) + "KB";
            el.innerHTML = `<input type="text" class="addl-mt" value="${escHtml(entry.mimetype)}" style="width:130px" placeholder="mimetype"><input type="text" class="addl-nm" value="${escHtml(entry.name)}" style="width:80px" placeholder="name (opt)"><span class="addl-info">${escHtml(file.name)}  ${sz}</span><button class="addl-rm">✕</button>`;
            el.querySelector(".addl-mt").addEventListener("change", (e2) => {
              entry.mimetype = e2.target.value.trim();
            });
            el.querySelector(".addl-nm").addEventListener("change", (e2) => {
              entry.name = e2.target.value.trim();
            });
            el.querySelector(".addl-rm").addEventListener("click", () =>
              removeAddlEntry(entry),
            );
            entry.el = el;
            addlEntries.push(entry);
            addlRows.appendChild(el);
          });
        });
        fi.click();
      });

      function collectAdditionalEntries() {
        return addlEntries.map((entry) => ({
          mimetype: entry.mimetype || "application/octet-stream",
          name: entry.name || "",
          // Binary entries are persistent in addlEntries; encodeViaWorker
          // transfers (detaches) entry buffers, so hand the worker a COPY —
          // otherwise the original detaches and a second encode fails with
          // "ArrayBuffer is detached and could not be cloned". Text entries
          // re-encode fresh each call, so they're already safe.
          data: entry.isText
            ? new TextEncoder().encode(entry.textEl ? entry.textEl.value : "")
            : entry.data
              ? entry.data.slice()
              : new Uint8Array(0),
        }));
      }

      // ── additional audio tracks ───────────────────────────────────────

      let addlTracks = [];

      function removeAddlTrack(track) {
        addlTracks = addlTracks.filter((t) => t !== track);
        track.el.remove();
      }

      addTrackBtn.addEventListener("click", () => {
        const fi = document.createElement("input");
        fi.type = "file";
        fi.accept = "audio/*,video/*";
        fi.addEventListener("change", async (e) => {
          const file = e.target.files[0];
          if (!file) return;
          const buf = await file.arrayBuffer();
          let audioBuf;
          try {
            audioBuf = await encActx.decodeAudioData(buf);
          } catch (_) {
            try {
              const tmpCtx = new AudioContext();
              audioBuf = await tmpCtx.decodeAudioData(buf.slice());
            } catch (err2) {
              alert("Could not decode audio: " + err2.message);
              return;
            }
          }
          const track = {
            audioBuf,
            name: file.name,
            sr: "src",
            ch: "src",
            bits: "16",
            dir: "fwd",
            mode: "relabel",
            normalize: "off",
            layout: "planar",
            blockSize: "64",
          };
          const el = document.createElement("div");
          el.className = "addl-row";
          el.innerHTML = `<span class="addl-info" style="flex:1">${escHtml(file.name)}</span><label style="margin-left:4px">ch</label><select class="tr-ch"><option value="src">src</option><option value="1">mono</option><option value="2">stereo</option></select><label>layout</label><select class="tr-layout"><option value="planar">planar</option><option value="interleaved">interleaved</option><option value="block">block</option></select><label>bits</label><select class="tr-bits"><option value="8">8</option><option value="16" selected>16</option><option value="24">24</option></select><label>dir</label><select class="tr-dir"><option value="fwd">fwd</option><option value="rev">rev</option></select><label>mode</label><select class="tr-mode"><option value="relabel">relabel</option><option value="resample">resample</option></select><label>norm</label><select class="tr-norm"><option value="off">off</option><option value="0">0</option><option value="-1">-1</option><option value="-3">-3</option></select><button class="addl-rm">✕</button>`;
          el.querySelector(".tr-ch").addEventListener("change", (ev) => {
            track.ch = ev.target.value;
          });
          el.querySelector(".tr-layout").addEventListener("change", (ev) => {
            track.layout = ev.target.value;
          });
          el.querySelector(".tr-bits").addEventListener("change", (ev) => {
            track.bits = ev.target.value;
          });
          el.querySelector(".tr-dir").addEventListener("change", (ev) => {
            track.dir = ev.target.value;
          });
          el.querySelector(".tr-mode").addEventListener("change", (ev) => {
            track.mode = ev.target.value;
          });
          el.querySelector(".tr-norm").addEventListener("change", (ev) => {
            track.normalize = ev.target.value;
          });
          el.querySelector(".addl-rm").addEventListener("click", () =>
            removeAddlTrack(track),
          );
          track.el = el;
          addlTracks.push(track);
          trackRows.appendChild(el);
        });
        fi.click();
      });

      async function buildAudioEntry(
        audioBuf,
        { sr, ch, bits, dir, mode, layout, blockSize, normalize },
      ) {
        const srcSr = audioBuf.sampleRate;
        const tgtSr =
          sr === "src"
            ? srcSr
            : Math.max(1000, Math.min(65535, parseInt(sr) || srcSr));
        const tgtCh =
          ch === "src" ? audioBuf.numberOfChannels : parseInt(ch) || 1;
        const tgtBit = parseInt(bits) || 16;
        const rev = dir === "rev",
          doResamp = mode === "resample";
        let slices = [];
        for (let c = 0; c < audioBuf.numberOfChannels; c++)
          slices.push(audioBuf.getChannelData(c).slice());
        let mixed = [];
        if (tgtCh === 1) {
          const len = slices[0].length,
            m = new Float32Array(len);
          for (let i = 0; i < len; i++) {
            let s = 0;
            for (const ch2 of slices) s += ch2[i];
            m[i] = s / slices.length;
          }
          mixed = [m];
        } else {
          if (slices.length === 1)
            mixed = [slices[0], new Float32Array(slices[0])];
          else mixed = [slices[0], slices[1]];
        }
        if (doResamp && tgtSr !== srcSr) {
          const origLen = mixed[0].length,
            newLen = Math.round(origLen * (tgtSr / srcSr));
          const tmp = encActx.createBuffer(mixed.length, origLen, srcSr);
          for (let c = 0; c < mixed.length; c++)
            tmp.getChannelData(c).set(mixed[c]);
          const offCtx = new OfflineAudioContext(mixed.length, newLen, tgtSr);
          const src2 = offCtx.createBufferSource();
          src2.buffer = tmp;
          src2.connect(offCtx.destination);
          src2.start();
          const rendered = await offCtx.startRendering();
          mixed = [];
          for (let c = 0; c < rendered.numberOfChannels; c++)
            mixed.push(rendered.getChannelData(c).slice());
        }
        if (rev) mixed = mixed.map((ch2) => ch2.slice().reverse());
        const normDb = StegassetteJobs.resolveNormalize(normalize);
        if (normDb != null)
          Stegassette.peakNormalize(mixed, { targetDb: normDb });
        const lyt = tgtCh > 1 ? layout || "planar" : "planar";
        const bsz = lyt === "block" ? parseInt(blockSize) || 1 : 0;
        const appended = Stegassette.layoutChannels({
          mixed,
          layout: lyt,
          blockSize: bsz,
        });
        const pcm = Stegassette.float32ToPcm(appended, tgtBit);
        const mime = Stegassette.buildAudioMime({
          bits: tgtBit,
          rate: tgtSr,
          channels: mixed.length,
          layout: lyt,
          blockSize: bsz,
        });
        return { mimetype: mime, name: "", data: pcm };
      }

      async function collectAdditionalTracks() {
        const entries = [];
        for (const track of addlTracks) {
          const entry = await buildAudioEntry(track.audioBuf, {
            sr: "src",
            ch: track.ch,
            bits: track.bits,
            dir: track.dir,
            mode: track.mode,
            normalize: track.normalize,
            layout: track.layout,
            blockSize: track.blockSize,
          });
          entries.push(entry);
        }
        return entries;
      }

      // ── encode readiness ──────────────────────────────────────────────

      // data mode encodes a cartridge with no audio at all; every other mode
      // needs both a cover and a decoded buffer
      function checkEncReady() {
        const haveImg = !!(encImgFile || encFrameCanvases.length > 0);
        encBtn.disabled =
          encMode === "data" ? !haveImg : !haveImg || !encAudioBuf;
      }

      // ── encode worker ─────────────────────────────────────────────────
      // Scaling + container encoding + PNG serialization are the heavy steps
      // (large RGBA buffers, the full pixel path). Running them in a worker keeps
      // the UI thread responsive and isolates that memory from the main heap —
      // the difference between a frozen/crashed tab and a smooth encode on big
      // audio. The worker source is inlined as a Blob so the app stays
      // self-contained; it importScripts the same stegassette.js the page uses.
      let encodeWorker = null;
      function getEncodeWorker() {
        if (encodeWorker !== null) return encodeWorker;
        // Worker + OffscreenCanvas are both required for the offloaded path.
        if (
          typeof Worker === "undefined" ||
          typeof OffscreenCanvas === "undefined"
        ) {
          encodeWorker = false; // sentinel: unavailable → use main-thread path
          return encodeWorker;
        }
        const coreUrl = JSON.stringify(
          new URL("../lib/stegassette.js", location.href).href,
        );
        const src = `
          importScripts(${coreUrl});
          self.onmessage = (e) => {
            const { srcData, srcW, srcH, entries, opts, B, aspectOverride, planBpp } = e.data;
            try {
              const srcImg = new Stegassette.Img(srcW, srcH, srcData);
              const totalBytes = Stegassette.containerInteriorBytes(entries);
              const padMargin = opts.pack === "aligned" ? planBpp - 1 : 0;
              const scaled = Stegassette.autoScaleImg(srcImg, totalBytes + padMargin, B, aspectOverride, planBpp, Stegassette.stgcHeaderWidth(opts));
              const encImg = Stegassette.encodeContainer(entries, scaled, opts, scaled);
              const outW = encImg.width, outH = encImg.height;
              const cnv = new OffscreenCanvas(outW, outH);
              cnv.getContext("2d").putImageData(
                new ImageData(new Uint8ClampedArray(encImg.data.buffer, encImg.data.byteOffset, encImg.data.byteLength), outW, outH),
                0, 0,
              );
              cnv.convertToBlob({ type: "image/png" }).then((blob) => {
                self.postMessage({ ok: true, blob, outW, outH });
              }).catch((err) => self.postMessage({ ok: false, error: String((err && err.message) || err) }));
            } catch (err) {
              self.postMessage({ ok: false, error: String((err && err.message) || err) });
            }
          };
        `;
        try {
          const url = URL.createObjectURL(
            new Blob([src], { type: "text/javascript" }),
          );
          encodeWorker = new Worker(url);
        } catch (_) {
          encodeWorker = false;
        }
        return encodeWorker;
      }

      // Main-thread equivalent of the worker (fallback path). Returns the same
      // { blob, outW, outH } shape so the caller is agnostic to where it ran.
      function encodeMainThread(p) {
        const srcImg = new Stegassette.Img(p.srcW, p.srcH, p.srcData);
        const totalBytes = Stegassette.containerInteriorBytes(p.entries);
        const padMargin = p.opts.pack === "aligned" ? p.planBpp - 1 : 0;
        const scaled = Stegassette.autoScaleImg(
          srcImg,
          totalBytes + padMargin,
          p.B,
          p.aspectOverride,
          p.planBpp,
          // small data-only payloads would otherwise scale below the header
          Stegassette.stgcHeaderWidth(p.opts),
        );
        // (entries, srcImg, opts, keyImg) — opts is third here, where the old
        // vendored core took the key image. Self-keying, so both are `scaled`.
        const encImg = Stegassette.encodeContainer(
          p.entries,
          scaled,
          p.opts,
          scaled,
        );
        const outW = encImg.width,
          outH = encImg.height;
        const cnv = Object.assign(document.createElement("canvas"), {
          width: outW,
          height: outH,
        });
        cnv
          .getContext("2d")
          .putImageData(
            new ImageData(
              new Uint8ClampedArray(
                encImg.data.buffer,
                encImg.data.byteOffset,
                encImg.data.byteLength,
              ),
              outW,
              outH,
            ),
            0,
            0,
          );
        return new Promise((resolve) =>
          cnv.toBlob((blob) => resolve({ blob, outW, outH }), "image/png"),
        );
      }

      // Run the encode off-thread when possible, falling back to the main thread
      // on any worker error (e.g. importScripts blocked under file://).
      function encodeViaWorker(p) {
        const w = getEncodeWorker();
        if (!w) return encodeMainThread(p);
        return new Promise((resolve, reject) => {
          const cleanup = () => {
            w.onmessage = null;
            w.onerror = null;
          };
          w.onmessage = (e) => {
            cleanup();
            if (e.data && e.data.ok)
              resolve({
                blob: e.data.blob,
                outW: e.data.outW,
                outH: e.data.outH,
              });
            else reject(new Error((e.data && e.data.error) || "encode failed"));
          };
          w.onerror = () => {
            cleanup();
            // worker is unusable — drop it and retry on the main thread
            encodeWorker = false;
            encodeMainThread(p).then(resolve, reject);
          };
          // Transfer the big buffers so they aren't copied into the worker.
          // De-dupe: listing the same ArrayBuffer twice (e.g. two entries that
          // share a buffer) detaches it on the first and throws on the second.
          const seen = new Set();
          const transfer = [];
          const addBuf = (b) => {
            if (b && !seen.has(b)) {
              seen.add(b);
              transfer.push(b);
            }
          };
          addBuf(p.srcData.buffer);
          for (const en of p.entries) if (en.data) addBuf(en.data.buffer);
          w.postMessage(p, transfer);
        });
      }

      // ── encode ────────────────────────────────────────────────────────

      // In series mode the encode button renders the SELECTED chunk — the same
      // cartridge "encode all" would produce for it, straight into the player.
      encBtn.addEventListener("click", () => runEncode(selectedChunkOverride()));
      function selectedChunkOverride() {
        if (encMode !== "series" || chunkSel < 0) return null;
        const c = chunks[chunkSel];
        if (!c) return null;
        return {
          startS: c.s,
          endS: c.e,
          imgFile: droppedFiles.get(c.image) || encImgFile,
          entries: c.entries,
          name: c.name,
        };
      }

      // runEncode(over) — `over` renders one chunk of a series instead of the
      // current form state: { startS, endS, imgFile, entries, name, fname,
      // download }. With `download` it saves straight to disk and leaves the
      // player/status alone, so "encode all" can loop without the UI fighting
      // it; without it, a single chunk behaves like any other encode.
      async function runEncode(over = null) {
        const batch = !!(over && over.download);
        const imgFile = over?.imgFile ?? encImgFile;
        const wantAudio = encMode !== "data" && !!encAudioBuf;
        if (!(imgFile || encFrameCanvases.length > 0)) return;
        if (encMode !== "data" && !encAudioBuf) return;
        stopPreview();
        encBtn.disabled = true;
        if (!batch) {
          dlBtn.style.display = "none";
          if (lastBlobUrl) {
            URL.revokeObjectURL(lastBlobUrl);
            lastBlobUrl = null;
          }
        }
        const say = (s) => {
          if (!batch) estats.textContent = s;
        };
        say(wantAudio ? "preparing audio…" : "preparing entries…");

        const clipS = over?.startS ?? trimAbsS;
        const clipE = over?.endS ?? trimAbsE;
        const srcSr = encAudioBuf ? encAudioBuf.sampleRate : 0;
        const tgtSr = Math.max(
          1000,
          Math.min(65535, parseInt(eSrEl.value) || srcSr || 22050),
        );
        const tgtCh = parseInt(eChEl.value) || 1;
        const tgtBit = parseInt(eBitsEl.value) || 16;
        const rev = eDirEl.value === "rev",
          doResamp = eModeEl.value === "resample";

        let mixed = [];
        let pcm = null,
          audioMime = null,
          layout = "planar",
          blockSize = 0;

        if (wantAudio) {
          const s0 = Math.floor(clipS * srcSr),
            s1 = Math.floor(clipE * srcSr);
          let slices = [];
          for (let c = 0; c < encAudioBuf.numberOfChannels; c++) {
            const d = encAudioBuf.getChannelData(c);
            slices.push(d.slice(Math.min(s0, d.length), Math.min(s1, d.length)));
          }
          if (!slices.length || !slices[0].length) {
            const msg = "✗ empty trim region";
            if (batch) throw new Error(msg);
            estats.textContent = msg;
            encBtn.disabled = false;
            return;
          }

          if (tgtCh === 1) {
            const len = slices[0].length,
              m = new Float32Array(len);
            for (let i = 0; i < len; i++) {
              let s = 0;
              for (const ch of slices) s += ch[i];
              m[i] = s / slices.length;
            }
            mixed = [m];
          } else {
            if (slices.length === 1)
              mixed = [slices[0], new Float32Array(slices[0])];
            else mixed = [slices[0], slices[1]];
          }

          if (doResamp && tgtSr !== srcSr) {
            const origLen = mixed[0].length,
              newLen = Math.round(origLen * (tgtSr / srcSr));
            const tmp = encActx.createBuffer(mixed.length, origLen, srcSr);
            for (let c = 0; c < mixed.length; c++)
              tmp.getChannelData(c).set(mixed[c]);
            const offCtx = new OfflineAudioContext(mixed.length, newLen, tgtSr);
            const src2 = offCtx.createBufferSource();
            src2.buffer = tmp;
            src2.connect(offCtx.destination);
            src2.start();
            const rendered = await offCtx.startRendering();
            mixed = [];
            for (let c = 0; c < rendered.numberOfChannels; c++)
              mixed.push(rendered.getChannelData(c).slice());
          }

          if (rev) mixed = mixed.map((ch) => ch.slice().reverse());

          const normDb = StegassetteJobs.resolveNormalize(
            eNormEl.value === "off" ? null : eNormEl.value,
          );
          if (normDb != null) Stegassette.peakNormalize(mixed, { targetDb: normDb });

          layout = parseInt(eChEl.value) > 1 ? eLayoutEl.value : "planar";
          blockSize = layout === "block" ? parseInt(eBlockSizeEl.value) || 1 : 0;
          const appended = Stegassette.layoutChannels({ mixed, layout, blockSize });
          pcm = Stegassette.float32ToPcm(appended, tgtBit);
          audioMime = Stegassette.buildAudioMime({
            bits: tgtBit,
            rate: tgtSr,
            channels: mixed.length,
            layout,
            blockSize,
          });
        }

        const additionalEntries = collectAdditionalEntries();
        const additionalTracks = wantAudio ? await collectAdditionalTracks() : [];
        // a chunk's own text rides ahead of the shared entries, matching the
        // order `split` expansion produces on the batch side
        const chunkEntries = (over?.entries || []).map((t) => ({
          mimetype: "text/plain",
          name: t.name || "",
          data: new TextEncoder().encode(t.text || ""),
        }));
        const entries = [
          ...(pcm ? [{ mimetype: audioMime, name: over?.name || "", data: pcm }] : []),
          ...additionalTracks,
          ...chunkEntries,
          ...additionalEntries,
        ];
        if (!entries.length) {
          const msg = "✗ nothing to encode — add an entry";
          if (batch) throw new Error(msg);
          estats.textContent = msg;
          encBtn.disabled = false;
          return;
        }

        say("loading image…");
        // border >= 1 → explicit extra px; 0 < border < 1 → fraction of output
        // width, resolved below once the payload-driven size is known.
        const borderRaw = parseFloat(eBorderEl.value) || 0;
        const borderFraction = borderRaw > 0 && borderRaw < 1 ? borderRaw : 0;
        let B = borderFraction ? 1 : 1 + Math.max(0, Math.floor(borderRaw));
        const traversal = eTraversal.value;
        const travP = {};
        if (traversal === "angle") {
          const _pa = parseInt(document.getElementById("eangle-a")?.value, 10);
          const _pb = parseInt(document.getElementById("eangle-b")?.value, 10);
          travP.a = isNaN(_pa) ? 1 : _pa;
          travP.b = isNaN(_pb) ? 1 : _pb;
        } else if (traversal === "fisher-yates") {
          const sv = document.getElementById("eFySeed")?.value.trim();
          // Generate the seed here (instead of letting encodeContainer pick one
          // internally) so we know it locally for the filename/status — avoids a
          // full post-encode decodeContainer just to read the seed back.
          travP.seed = sv
            ? parseInt(sv, 10) >>> 0
            : (Math.random() * 0x100000000) >>> 0;
        }
        if (eKeymap.value === "offset") {
          travP.kx = parseInt(document.getElementById("ekx")?.value, 10) | 0;
          travP.ky = parseInt(document.getElementById("eky")?.value, 10) | 0;
        }
        const { pack, channels } = gatherChannelPlan();
        const opts = {
          combine: representativeCombine(),
          traversal,
          keymap: eKeymap.value,
          borderWidth: B,
          params: travP,
          pack,
          channels,
          bytesPerSample: tgtBit >> 3,
        };
        const planBpp = Stegassette.normalizeChannelPlan(
          opts,
          opts.bytesPerSample,
          0,
        ).bytesPerPixel;

        let rawSrcCnv;
        if (!over && encFrameCanvases.length > 0) {
          rawSrcCnv =
            encFrameCanvases.length === 1
              ? encFrameCanvases[0].canvas
              : composeMosaic(encFrameCanvases, mosaicLayoutEl.value);
        } else {
          let bmp;
          try {
            bmp = await createImageBitmap(imgFile, {
              colorSpaceConversion: "none",
            });
          } catch (e) {
            if (batch) throw e;
            estats.textContent = "✗ " + e.message;
            encBtn.disabled = false;
            return;
          }
          rawSrcCnv = Object.assign(document.createElement("canvas"), {
            width: bmp.width,
            height: bmp.height,
          });
          rawSrcCnv.getContext("2d").drawImage(bmp, 0, 0);
          bmp.close();
        }
        const srcW = rawSrcCnv.width,
          srcH = rawSrcCnv.height;
        // Img accepts the Uint8ClampedArray from getImageData directly — no need
        // to copy into a fresh Uint8Array (saves one full RGBA buffer, ~W*H*4 B).
        const srcImg = new Stegassette.Img(
          srcW,
          srcH,
          rawSrcCnv
            .getContext("2d", { willReadFrequently: true })
            .getImageData(0, 0, srcW, srcH).data,
        );

        let aspectOverride = null;
        const aspectVal = eAspect.value;
        if (aspectVal === "custom") {
          const aw = parseFloat(eAspectWEl.value) || 16,
            ah = parseFloat(eAspectHEl.value) || 9;
          aspectOverride = aw / ah;
        } else if (aspectVal !== "original") {
          const [aw, ah] = aspectVal.split(":").map(Number);
          aspectOverride = aw / ah;
        }

        // ── capacity guard ──────────────────────────────────────────────
        // Estimate the output image size up front so a too-large payload warns
        // instead of crashing the tab mid-encode. Data pixels are ~half the
        // image, so total ≈ 2× the data pixels the payload needs.
        const guardBytes = Stegassette.containerInteriorBytes(entries);
        const reqDataPx = Math.ceil(guardBytes / planBpp);
        const estPx = reqDataPx * 2;
        // resolve a fractional border (% of output width) → px now that the
        // payload-driven interior size is known; keep opts.borderWidth in sync.
        if (borderFraction) {
          const aspect = aspectOverride != null ? aspectOverride : srcW / srcH;
          B = Stegassette.resolveBorderWidth(borderFraction, reqDataPx, aspect);
          opts.borderWidth = B;
        }
