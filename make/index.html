<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>stegassette</title>
    <link rel="stylesheet" href="../amplib-ui.css" />
    <style>
      /* Screen-specific styling on top of amplib-ui. The encoder is a fixed
         dark tool — no data-theme, so amplib's default polarity (ink on black)
         applies and native chrome renders dark via color-scheme. Everything
         here is either layout for this screen or a component that exists only
         here (waveform, dual-range, chunk editor, frame picker). */

      body {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: var(--ht-flow);
        padding: var(--ht-space-6);
      }
      section {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: var(--ht-flow);
        width: 100%;
      }
      section[hidden] {
        display: none;
      }

      /* Drop states are amplib's (data-state="over", data-ready). Local: a
         page-wide drag lights the drop the payload belongs to, same look as
         its over state. */
      body.drag-audio #adrop,
      body.drag-image #idrop {
        color: var(--ht-ink);
        border-color: var(--ht-line-strong);
        border-style: solid;
        background-color: var(--ht-raised);
      }

      /* mode bar: tabs plus a right-aligned note */
      .mode-bar {
        display: flex;
        align-items: center;
        gap: var(--ht-gap);
        width: 100%;
        flex-wrap: wrap;
      }
      .mode-note {
        margin-left: auto;
        text-align: right;
      }

      /* jobs queue: an amplib panel + list */
      .jobs-list {
        --ht-list-max: 200px;
      }
      .ji-files {
        font-size: var(--ht-text-small);
      }
      .ji-ok {
        opacity: 0.7;
      }
      /* failure marks survive the inverted selected row and greyscale */
      .ji-miss {
        font-weight: 700;
      }
      .ji-miss::before {
        content: "!";
      }

      /* settings panel — two columns of field rows */
      .settings-panel {
        --ht-field-label: 4.75rem;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: var(--ht-space-5) var(--ht-space-8);
        width: 100%;
      }
      .sg {
        display: flex;
        flex-direction: column;
        gap: var(--ht-space-1);
      }
      .sg-hdr {
        padding-block-end: var(--ht-space-2);
        border-block-end: var(--ht-hairline) solid var(--ht-line);
        margin-block-end: var(--ht-space-1);
      }

      /* waveform */
      .wave-section {
        display: none;
        flex-direction: column;
        gap: var(--ht-space-1);
        width: 100%;
      }
      .wave-section.on {
        display: flex;
      }
      #waveCoarse {
        height: 52px;
      }
      #waveFine {
        height: 72px;
      }

      /* dual-range: two overlapping natives making one span control */
      .dr {
        position: relative;
        height: 18px;
        width: 100%;
      }
      .dr::before {
        content: "";
        position: absolute;
        inset: 0;
        margin: auto;
        height: var(--ht-hairline);
        background: var(--ht-line-strong);
        pointer-events: none;
      }
      .dr-fill {
        position: absolute;
        top: 50%;
        height: 2px;
        transform: translateY(-50%);
        background: var(--ht-ink);
        pointer-events: none;
      }
      .dr input[type="range"] {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        min-block-size: 0;
        margin: 0;
        padding: 0;
        appearance: none;
        -webkit-appearance: none;
        background: transparent;
        pointer-events: none;
      }
      .dr input[type="range"]::-webkit-slider-runnable-track {
        background: transparent;
        height: 2px;
      }
      .dr input[type="range"]::-moz-range-track {
        background: transparent;
        height: 2px;
      }
      .dr input[type="range"]::-webkit-slider-thumb {
        pointer-events: all;
        -webkit-appearance: none;
        appearance: none;
        width: 0.5rem;
        height: 0.875rem;
        border-radius: var(--ht-radius);
        background: var(--ht-ink);
        cursor: col-resize;
        margin-top: -6px;
      }
      .dr input[type="range"]::-moz-range-thumb {
        pointer-events: all;
        width: 0.5rem;
        height: 0.875rem;
        border-radius: var(--ht-radius);
        background: var(--ht-ink);
        border: none;
        cursor: col-resize;
      }

      .trim-row {
        display: flex;
        align-items: center;
        gap: var(--ht-space-2);
        flex-wrap: wrap;
      }
      .trim-row label {
        color: var(--ht-ink-dim);
        font-size: var(--ht-text-small);
      }

      /* additional entries */
      .addl-row {
        display: flex;
        align-items: center;
        gap: var(--ht-space-2);
        width: 100%;
        padding: var(--ht-space-2) var(--ht-space-3);
        border: var(--ht-hairline) solid var(--ht-line);
        background: var(--ht-paper);
      }
      .addl-row textarea {
        flex: 1;
        min-height: 42px;
      }
      .addl-info {
        color: var(--ht-ink-faint);
        font-size: var(--ht-text-small);
        flex: 1;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .entries-hdr {
        display: flex;
        align-items: center;
        gap: var(--ht-space-2);
      }

      #estats {
        flex: 1 1 auto;
        inline-size: auto;
        text-align: end;
      }

      /* player section */
      .player-hdr {
        display: flex;
        align-items: center;
        gap: var(--ht-space-4);
        width: 100%;
        border-block-start: var(--ht-hairline) solid var(--ht-line);
        padding-block-start: var(--ht-flow);
      }
      #displayRow {
        display: none;
        flex-wrap: wrap;
        gap: var(--ht-space-5);
        width: 100%;
        align-items: flex-start;
      }
      .disp-col {
        display: flex;
        flex-direction: column;
        gap: var(--ht-space-2);
        flex: 1 1 260px;
        max-width: 460px;
      }
      .img-wrap {
        position: relative;
        border: var(--ht-hairline) solid var(--ht-line);
        background: var(--ht-sunken);
        max-width: 100%;
      }
      /* both are ht-media-flush in markup; only geometry is local */
      canvas.display {
        display: block;
        width: 100%;
        height: auto;
      }
      #ov {
        position: absolute;
        inset: 0;
        width: 100%;
        height: auto;
        pointer-events: none;
      }
      .pbar {
        display: flex;
        align-items: center;
        gap: var(--ht-gap);
        flex-wrap: wrap;
      }

      /* entry list */
      #pentryList {
        width: 100%;
        display: none;
      }
      .entry-card {
        width: 100%;
        border: var(--ht-hairline) solid var(--ht-line);
        background: var(--ht-paper);
        margin-block-end: var(--ht-space-2);
      }
      .ec-hdr {
        display: flex;
        align-items: center;
        gap: var(--ht-space-2);
        padding: var(--ht-space-2) var(--ht-space-4);
        border-block-end: var(--ht-hairline) solid var(--ht-line);
        font-size: var(--ht-text-small);
      }
      .ec-mt {
        color: var(--ht-ink);
        font-weight: 700;
        flex: 1;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .ec-nm {
        color: var(--ht-ink-faint);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        max-width: 140px;
      }
      .ec-sz {
        color: var(--ht-ink-faint);
        margin-inline-start: auto;
        white-space: nowrap;
        padding-inline-start: var(--ht-space-2);
      }
      .ec-dl {
        color: var(--ht-ink-dim);
        text-decoration: none;
        padding: var(--ht-space-1) var(--ht-space-4);
        border: var(--ht-hairline) solid var(--ht-line);
        margin-inline-start: var(--ht-space-2);
        background: var(--ht-raised);
      }
      .ec-body {
        padding: var(--ht-space-3) var(--ht-space-4);
      }
      .ec-body pre {
        /* = ht-type-code + ht-participation-scroll */
        white-space: pre-wrap;
        word-break: break-all;
        max-height: 200px;
        overflow-y: auto;
        scrollbar-width: thin;
        scrollbar-color: var(--ht-line-strong) transparent;
        scrollbar-gutter: stable;
        font-size: var(--ht-text-small);
      }
      .ec-body img {
        max-width: 100%;
        display: block;
      }
      .ec-hint {
        color: var(--ht-ink-faint);
        font-size: var(--ht-text-small);
      }

      /* frame picker */
      .frame-picker-section {
        display: none;
        flex-direction: column;
        gap: var(--ht-space-1);
        width: 100%;
      }
      .frame-picker-section.on {
        display: flex;
      }
      .frame-thumbs {
        display: flex;
        flex-wrap: wrap;
        gap: var(--ht-space-2);
        width: 100%;
      }
      .frame-thumb {
        position: relative;
        border: var(--ht-hairline) solid var(--ht-line);
        background: var(--ht-sunken);
        flex-shrink: 0;
      }
      .frame-thumb img {
        display: block;
        width: 80px;
        height: 45px;
        object-fit: cover;
      }
      .frame-thumb-del {
        position: absolute;
        top: 1px;
        right: 1px;
        min-block-size: 0;
        padding: 1px 3px;
        border: 0;
        background: var(--ht-paper);
        color: var(--ht-ink-dim);
        font-size: var(--ht-text-small);
        line-height: 1;
        cursor: pointer;
      }
      .frame-thumb-del:hover {
        color: var(--ht-ink);
      }
      .frame-thumb-num {
        position: absolute;
        bottom: 1px;
        left: 3px;
        font-size: var(--ht-text-small);
        color: var(--ht-ink-dim);
        background: var(--ht-paper);
        padding: 0 2px;
        pointer-events: none;
      }

      /* encoder layout: roomy main column + controls sidebar. The two columns
         line up on their first text baseline, not their box tops — the main
         column opens on a control row (inset by the button's padding and
         border) and the sidebar on a bare label, so box-top alignment reads
         as crooked. Baseline alignment re-derives itself if either side's
         padding changes, which a hand-tuned offset would not. */
      .enc-layout {
        display: flex;
        gap: var(--ht-space-6);
        width: 100%;
        align-items: baseline;
        flex-wrap: wrap;
      }
      .enc-main {
        flex: 1 1 440px;
        min-width: 0;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: var(--ht-flow);
      }
      .enc-side {
        flex: 0 0 var(--ht-sidebar);
        max-width: var(--ht-sidebar);
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: var(--ht-space-5);
        position: sticky;
        top: var(--ht-space-4);
        --ht-field-label: 3.75rem;
      }
      .enc-side .settings-panel {
        grid-template-columns: 1fr;
        min-width: 0;
      }
      .enc-side .sg,
      .enc-side .field {
        min-width: 0;
      }
      .enc-side select,
      .enc-side input[type="number"],
      .enc-side input[type="text"] {
        max-width: 100%;
        min-width: 0;
      }
      .enc-side .chan-row {
        flex-wrap: wrap;
        max-width: 100%;
      }
      .enc-side .chan-row select {
        flex: 1 1 auto;
      }
      @media (max-width: 760px) {
        .enc-side {
          flex-basis: 100%;
          max-width: 100%;
          position: static;
        }
      }

      /* channel plan slot rows — the dots keep their channel colours: they
         name actual R/G/B pixel channels, which is subject matter here */
      .chan-plan-rows {
        display: flex;
        flex-direction: column;
        gap: var(--ht-space-1);
        margin-block: var(--ht-space-1);
      }
      .chan-row {
        display: flex;
        align-items: center;
        gap: var(--ht-space-2);
      }
      .chan-row .ch-dot {
        width: 10px;
        height: 10px;
        display: inline-block;
      }
      .chan-row.dim {
        opacity: 0.35;
      }
      .chan-row button {
        padding: 0 5px;
      }
      /* a lossy reconstruction path: full ink and a leading mark, no hue */
      #reconLabel[data-warn] {
        color: var(--ht-ink);
        font-weight: 700;
      }
      #reconLabel[data-warn]::before {
        content: "! ";
      }

      /* mode-dependent visibility */
      body[data-mode="data"] #adrop,
      body[data-mode="data"] .wave-section,
      body[data-mode="data"] #addTrackBtn,
      body[data-mode="data"] .sg-audio {
        display: none !important;
      }
      /* the frame picker belongs to video mode alone, even once a video has
         loaded and given it the .on class */
      body:not([data-mode="video"]) .frame-picker-section {
        display: none !important;
      }
      .chunks-section {
        display: none;
        flex-direction: column;
        gap: var(--ht-space-2);
        width: 100%;
      }
      body[data-mode="series"] .chunks-section.on {
        display: flex;
      }

      /* chunk editor (series mode) */
      .chunks-hdr {
        display: flex;
        align-items: center;
        gap: var(--ht-space-2);
        flex-wrap: wrap;
      }
      .chunks-hdr input[type="number"] {
        width: 52px;
      }
      .chunk-list {
        /* = ht-participation-scroll */
        display: flex;
        flex-direction: column;
        border: var(--ht-hairline) solid var(--ht-line);
        background: var(--ht-paper);
        max-height: 340px;
        overflow-y: auto;
        scrollbar-width: thin;
        scrollbar-color: var(--ht-line-strong) transparent;
        scrollbar-gutter: stable;
      }
      .chunk-list:empty {
        display: none;
      }
      .chunk-row {
        display: flex;
        align-items: center;
        gap: var(--ht-space-2);
        padding: var(--ht-space-1) var(--ht-space-2);
        border-block-end: var(--ht-hairline) solid var(--ht-line);
      }
      .chunk-row:last-child {
        border-block-end: none;
      }
      /* selection: a raised surface plus a hard ink rule at the start — the
         row holds live inputs, so full polarity inversion would fight them */
      .chunk-row.sel {
        background: var(--ht-raised);
        box-shadow: inset 2px 0 0 var(--ht-ink);
      }
      .chunk-row input[type="number"] {
        width: 62px;
      }
      .chunk-row .ck-idx {
        color: var(--ht-ink-faint);
        min-width: 18px;
        cursor: pointer;
        user-select: none;
      }
      .chunk-row.sel .ck-idx {
        color: var(--ht-ink);
        font-weight: 700;
      }
      .chunk-row .ck-out {
        flex: 1;
        min-width: 70px;
      }
      .chunk-row .ck-img {
        max-width: 150px;
      }
      .chunk-row .ck-img.miss {
        color: var(--ht-ink-faint);
        border-color: var(--ht-line);
      }
      .chunk-row .ck-dur,
      .chunk-row .ck-size {
        color: var(--ht-ink-faint);
        font-size: var(--ht-text-small);
        white-space: nowrap;
      }
      .chunk-row .ck-size.over {
        color: var(--ht-ink);
        font-weight: 700;
      }
      .chunk-row .ck-size.over::before {
        content: "! ";
      }
      .chunk-row button {
        padding: 0 6px;
      }
      .chunk-row .ck-txt.has {
        color: var(--ht-ink);
        border-color: var(--ht-line-strong);
      }
      .chunk-entries {
        display: none;
        flex-direction: column;
        gap: var(--ht-space-1);
        padding: var(--ht-space-1) var(--ht-space-2) var(--ht-space-3) 28px;
        border-block-end: var(--ht-hairline) solid var(--ht-line);
        background: var(--ht-raised);
      }
      .chunk-entries.open {
        display: flex;
      }
      .chunk-entries .addl-row {
        margin: 0;
      }
      .chunks-foot {
        display: flex;
        align-items: center;
        gap: var(--ht-space-2);
        flex-wrap: wrap;
        font-size: var(--ht-text-small);
        color: var(--ht-ink-faint);
      }
    </style>
  </head>
  <body data-mode="clip" data-density="compact">
    <h1>stegassette</h1>

    <!-- ═══ ENCODER ═══ -->
    <section id="encSection">
      <!-- capture mode: which source material this cartridge is made from.
           everything downstream (settings, entries, encode, player) is shared. -->
      <div class="mode-bar" id="modeBar">
        <div class="tabs">
          <button data-mode="data">data</button>
          <button data-mode="clip" aria-selected="true">clip</button>
          <button data-mode="series">series</button>
          <button data-mode="video">video</button>
        </div>
        <span class="mode-note ht-type-small" id="modeNote"></span>
      </div>

      <!-- jobs queue: drop a jobs array (jobs/*.json) to load every item -->
      <div id="jobsPanel" class="panel u-full" hidden>
        <div class="panel__header">
          <span id="jobsTitle" class="u-grow">jobs</span>
          <button id="jobsClear">✕</button>
        </div>
        <div id="jobsList" class="list jobs-list"></div>
        <footer class="panel__footer">
          <span id="jobsMsg"
            >drop the referenced images/audio too (any time) to auto-attach by
            filename</span
          >
        </footer>
      </div>

      <div class="ht-arrange-row u-full">
        <div id="idrop" class="drop">
          <span class="drop__label">image / video</span>
          <span class="drop__sub">PNG · JPG · MP4 · MOV…</span>
        </div>
        <input id="ifi" type="file" accept="image/*,video/*" hidden />
        <div id="adrop" class="drop">
          <span class="drop__label">audio</span>
          <span class="drop__sub">any format</span>
        </div>
        <input id="afi" type="file" accept="audio/*,video/*" hidden />
      </div>

      <!-- video frame picker -->
      <div class="frame-picker-section" id="framePickerSection">
        <video id="frameVideo" style="display: none" preload="auto"></video>
        <canvas id="framePreview"></canvas>
        <input
          type="range"
          id="vScrub"
          min="0"
          max="10000"
          value="0"
          step="1"
        />
        <div class="ht-arrange-row u-full">
          <span
            id="vTimeEl"
            class="ht-type-small"
            style="min-width: 72px"
          ></span>
          <button id="captureFrameBtn">+ snapshot</button>
          <button id="clearFramesBtn" style="display: none">clear all</button>
          <label class="u-end">layout</label>
          <select id="mosaicLayout">
            <option value="cols">cols</option>
            <option value="rows">rows</option>
            <option value="2x2">2×2</option>
            <option value="3x3">3×3</option>
            <option value="4x4">4×4</option>
          </select>
        </div>
        <div id="frameThumbs" class="frame-thumbs"></div>
      </div>

      <!-- waveform editor -->
      <div class="wave-section" id="waveSection">
        <canvas id="waveCoarse"></canvas>
        <div class="dr" id="zoomDr">
          <div class="dr-fill" id="zoomFill"></div>
          <input
            type="range"
            id="zoomS"
            min="0"
            max="10000"
            value="0"
            step="1"
          />
          <input
            type="range"
            id="zoomE"
            min="0"
            max="10000"
            value="10000"
            step="1"
          />
        </div>
        <canvas id="waveFine"></canvas>
        <div class="dr" id="trimDr">
          <div class="dr-fill" id="trimFill"></div>
          <input
            type="range"
            id="trimS"
            min="0"
            max="10000"
            value="0"
            step="1"
          />
          <input
            type="range"
            id="trimE"
            min="0"
            max="10000"
            value="10000"
            step="1"
          />
        </div>
        <div class="trim-row">
          <label>start (ms)</label>
          <input
            type="number"
            id="trimStartN"
            style="width: 70px"
            step="1"
            min="0"
          />
          <label>end (ms)</label>
          <input
            type="number"
            id="trimEndN"
            style="width: 70px"
            step="1"
            min="0"
          />
          <button id="prevPlayBtn">▶</button>
          <button id="prevStopBtn">■</button>
          <span id="trimDur" class="ht-type-small"></span>
        </div>
      </div>

      <!-- chunk editor (series mode): one audio divided across N covers.
           the trim region is the source window; chunks subdivide it. -->
      <div class="chunks-section" id="chunksSection">
        <div class="chunks-hdr">
          <span class="ht-type-eyebrow u-grow"
            >chunks (<span id="ckCount">0</span>)</span
          >
          <button id="ckSplitBtn" title="split the chunk under the caret (click the waveform to place it)">
            ÷ at caret
          </button>
          <input type="number" id="ckEvery" value="8" min="1" step="1" title="how many equal chunks" />
          <button id="ckEvenBtn" title="divide the source window into equal chunks">equal</button>
          <input type="number" id="ckMaxMp" value="16" min="0.1" step="0.1" title="output megapixels allowed per chunk" />
          <button id="ckFitBtn" title="chunk so each image fits that pixel budget">fit MP</button>
          <button id="ckImgBtn" title="assign dropped images to chunks in filename order — with no chunks yet, makes one per image">↧ images</button>
          <button id="ckClearBtn" title="clear all chunks">✕</button>
        </div>
        <div class="chunk-list" id="ckList"></div>
        <div class="chunks-foot">
          <button id="ckEncodeAllBtn">encode all ↓</button>
          <select id="ckJsonKind" title="which shape to copy">
            <option value="split">split job</option>
            <option value="array">jobs array</option>
          </select>
          <button id="ckCopyBtn">copy json</button>
          <span id="ckMsg" class="ht-type-small"></span>
        </div>
      </div>

      <!-- settings panel -->
      <div class="settings-panel">
        <div class="sg sg-audio">
          <div class="sg-hdr ht-type-eyebrow">audio</div>
          <div class="field">
            <label>rate</label>
            <input
              type="number"
              id="eSr"
              style="width: 72px"
              min="3000"
              max="65535"
            />
          </div>
          <div class="field">
            <label>channels</label>
            <select id="eCh">
              <option value="1">mono</option>
              <option value="2">stereo</option>
            </select>
          </div>
          <div class="field" id="eLayoutWrap">
            <label>layout</label>
            <select id="eLayout">
              <option value="planar">planar</option>
              <option value="interleaved">interleaved</option>
              <option value="block">block</option>
            </select>
            <input
              id="eBlockSize"
              type="number"
              min="1"
              value="64"
              style="width: 44px; display: none"
              title="block size (samples)"
            />
          </div>
          <div class="field">
            <label>bits</label>
            <select id="eBits">
              <option value="8">8</option>
              <option value="16" selected>16</option>
              <option value="24">24</option>
            </select>
          </div>
          <div class="field">
            <label>direction</label>
            <select id="eDir">
              <option value="fwd">fwd</option>
              <option value="rev">rev</option>
            </select>
          </div>
          <div class="field">
            <label>mode</label>
            <select id="eMode">
              <option value="relabel">relabel</option>
              <option value="resample">resample</option>
            </select>
            <span id="speedHint" class="ht-type-small"></span>
          </div>
          <div class="field">
            <label>normalize</label>
            <select id="eNorm">
              <option value="off">off</option>
              <option value="0">0 dBFS</option>
              <option value="-1">-1 dBFS</option>
              <option value="-3">-3 dBFS</option>
            </select>
          </div>
        </div>

        <div class="sg">
          <div class="sg-hdr ht-type-eyebrow">steg</div>
          <div class="field">
            <label>traversal</label>
            <select id="eTraversal">
              <option>raster</option>
              <option>boustrophedon</option>
              <option>spiral</option>
              <option>angle</option>
              <option>fisher-yates</option>
              <option>center-out</option>
              <option>hilbert</option>
              <option>polar</option>
              <option>bayer</option>
            </select>
            <span
              id="travParams"
              style="display: none; align-items: center; gap: 4px"
            ></span>
          </div>
          <div class="field">
            <label>keymap</label>
            <!-- Two kinds, kept visibly apart because they change the shape of
                 the encode, not just where the key is read from. The keyless
                 pair generates the key from position, so no pixel is held back:
                 the image is about half the area and the cover is gone. -->
            <select id="eKeymap">
              <optgroup label="key pixel">
                <option value="adjacent">adjacent</option>
                <option value="poles">poles</option>
                <option value="mirror-x">mirror-x</option>
                <option value="mirror-y">mirror-y</option>
                <option value="offset">offset</option>
                <option value="rotate">rotate</option>
              </optgroup>
              <optgroup label="keyless — half size">
                <option value="none">none</option>
              </optgroup>
            </select>
            <span
              id="keymapParams"
              style="display: none; align-items: center; gap: 4px"
            ></span>
          </div>
          <!-- channel plan: maps 1:1 to JSON { pack, channels:[{ch,combine}] }.
               each row is one slot (an active R/G/B channel + its combine op);
               row order = slot order. aligned caps the count to bytes/sample. -->
          <div class="field">
            <label>channels</label>
            <select id="ePack">
              <option value="packed">packed</option>
              <option value="aligned">aligned</option>
              <option value="mono">mono</option>
            </select>
            <button id="chanAddBtn" type="button" title="add a channel slot">
              + slot
            </button>
            <span class="u-faint">all</span>
            <select id="eAllCombine" title="set every slot's combine"></select>
            <span id="packHint" class="ht-type-small"></span>
          </div>
          <div id="chanPlanRows" class="chan-plan-rows"></div>
          <div class="field">
            <span id="reconLabel" class="ht-type-small"></span>
          </div>
          <div class="field">
            <label>aspect</label>
            <select id="eAspect">
              <option value="original">original</option>
              <option value="1:1">1:1</option>
              <option value="16:9">16:9</option>
              <option value="4:3">4:3</option>
              <option value="9:16">9:16</option>
              <option value="3:4">3:4</option>
              <option value="custom">custom</option>
            </select>
            <span
              id="eAspectCustom"
              style="display: none; align-items: center; gap: 4px"
            >
              <input
                type="number"
                id="eAspectW"
                style="width: 40px"
                min="1"
                value="16"
                step="1"
              />
              <span class="u-faint">:</span>
              <input
                type="number"
                id="eAspectH"
                style="width: 40px"
                min="1"
                value="9"
                step="1"
              />
            </span>
          </div>
          <div class="field">
            <label>border +</label>
            <input
              type="number"
              id="eBorder"
              style="width: 48px"
              min="0"
              value="0"
              step="any"
              title="≥1 = extra pixels; 0–0.99 = fraction of output width"
            />
          </div>
        </div>
      </div>

      <!-- additional entries -->
      <div id="addlSection" class="u-full">
        <div class="entries-hdr">
          <span class="ht-type-eyebrow">entries</span>
          <button id="addTextBtn">+ text</button>
          <button id="addFileBtn">+ file</button>
          <button id="addTrackBtn">+ audio track</button>
        </div>
        <div id="addlRows"></div>
        <div id="trackRows"></div>
      </div>

      <!-- encode action (.action-row is a JS hook for the layout builder) -->
      <div class="action-row ht-arrange-row u-full">
        <button id="encBtn" disabled>encode</button>
        <button id="dlBtn" style="display: none">↓ download</button>
        <button id="copyJsonBtn" title="copy this job as a jobs/*.json entry">
          copy as json
        </button>
        <span id="sizeHint" class="ht-type-small"></span>
        <div id="estats" class="status"></div>
      </div>
    </section>

    <!-- ═══ PLAYER (appears when STGC loaded) ═══ -->
    <section id="playerSection" hidden>
      <div class="player-hdr">
        <span class="ht-type-eyebrow u-grow">player</span>
        <button id="reconBtn" disabled>↓ reconstruct</button>
        <button id="pCloseBtn">✕ close</button>
      </div>
      <div id="displayRow">
        <div class="disp-col">
          <div class="ht-type-eyebrow">encoded · plays → reconstructed</div>
          <div class="img-wrap" id="imgWrap">
            <canvas id="imgC" class="display ht-media-flush"></canvas>
            <canvas id="ov" class="ht-media-flush"></canvas>
          </div>
        </div>
        <div class="disp-col" id="reconCol">
          <div class="ht-type-eyebrow">reconstructed</div>
          <div class="img-wrap">
            <canvas id="reconC" class="display ht-media-flush"></canvas>
          </div>
        </div>
      </div>
      <div class="pbar" id="pbar" style="display: none">
        <button id="playBtn" disabled>▶ play</button>
        <button id="stopBtn" disabled>■ stop</button>
        <span id="clock" class="u-faint">0:00 / 0:00</span>
      </div>
      <div id="pstatus" class="status"></div>
      <div id="pentryList"></div>
    </section>

    <script src="../lib/stegassette.js"></script>
    <script src="../lib/stegassette-jobs.js"></script>
    <script>
      "use strict";
      console.log("stegassette codec " + Stegassette.CODEC_VERSION);

      const DR_MAX = 10000;

      // ═══════════════════════════════════════════════════════════════════
      // PLAYER
      // ═══════════════════════════════════════════════════════════════════

      let pst = null,
        pactx = null,
        psrc = null,
        psrcs = [],
        pt0 = 0,
        praf = null;

      const playerSection = document.getElementById("playerSection");
      const displayRow = document.getElementById("displayRow");
      const imgWrap = document.getElementById("imgWrap");
      const imgC = document.getElementById("imgC");
      const ovC = document.getElementById("ov");
      const reconCol = document.getElementById("reconCol");
      const reconC = document.getElementById("reconC");
      const rc = reconC.getContext("2d");
      const pbar = document.getElementById("pbar");
      const playBtn = document.getElementById("playBtn");
      const stopBtn = document.getElementById("stopBtn");
      const reconBtn = document.getElementById("reconBtn");
      const clockEl = document.getElementById("clock");
      const pstatus = document.getElementById("pstatus");
      const pCloseBtn = document.getElementById("pCloseBtn");
      const ic = imgC.getContext("2d");
      const oc = ovC.getContext("2d");

      playBtn.addEventListener("click", pplay);
      stopBtn.addEventListener("click", () => pstop());
      reconBtn.addEventListener("click", reconstruct);
      pCloseBtn.addEventListener("click", () => {
        pstop();
        pst = null;
        playerSection.setAttribute("hidden", "");
        displayRow.style.display = "none";
        pbar.style.display = "none";
        pstatus.textContent = "";
        document.getElementById("pentryList").style.display = "none";
      });

      const tt = (s) => {
        const m = (s / 60) | 0;
        return m + ":" + ((s | 0) % 60).toString().padStart(2, "0");
      };

      function escHtml(s) {
        return String(s)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      function renderEntryList(entries) {
        const list = document.getElementById("pentryList");
        list.innerHTML = "";
        if (!entries || !entries.length) {
          list.style.display = "none";
          return;
        }
        list.style.display = "block";
        for (const entry of entries) {
          const isAudio = entry.mimetype.startsWith("audio/");
          const isText =
            entry.mimetype.startsWith("text/") &&
            entry.mimetype !== "text/html";
          const isImg = entry.mimetype.startsWith("image/");
          const sz = entry.data.length;
          const szStr =
            sz < 1024
              ? sz + "B"
              : sz < 1048576
                ? (sz / 1024).toFixed(1) + "KB"
                : (sz / 1048576).toFixed(1) + "MB";
          const blob = new Blob([entry.data], {
            type: entry.mimetype.split(";")[0].trim(),
          });
          const url = URL.createObjectURL(blob);
          const ext = (entry.mimetype.split("/")[1] || "bin")
            .split(";")[0]
            .trim();
          const fname = escHtml(entry.name || "entry." + ext);
          let bodyHtml;
          if (isAudio) {
            const { bits, rate, channels } = Stegassette.parseAudioMime(
              entry.mimetype,
            );
            bodyHtml = `<div class="ec-hint">${bits}bit · ${rate}Hz · ${channels}ch · plays via controls above</div>`;
          } else if (isText) {
            const text = new TextDecoder().decode(entry.data);
            bodyHtml = `<pre>${escHtml(text)}</pre>`;
          } else if (isImg) {
            bodyHtml = `<img src="${url}" alt="">`;
          } else {
            bodyHtml = `<div class="ec-hint">download to view</div>`;
          }
          const card = document.createElement("div");
          card.className = "entry-card";
          card.innerHTML =
            `<div class="ec-hdr">` +
            `<span class="ec-mt">${escHtml(entry.mimetype)}</span>` +
            (entry.name
              ? `<span class="ec-nm">${escHtml(entry.name)}</span>`
              : "") +
            `<span class="ec-sz">${szStr}</span>` +
            `<a href="${url}" download="${fname}" class="ec-dl">↓</a>` +
            `</div><div class="ec-body">${bodyHtml}</div>`;
          list.appendChild(card);
        }
      }

      function pload(file) {
        pstatus.textContent = "reading image…";
        playerSection.removeAttribute("hidden");
        playBtn.disabled = stopBtn.disabled = true;
        reconBtn.disabled = true;
        pstop(false);
        document.getElementById("pentryList").style.display = "none";
        Promise.all([
          createImageBitmap(file),
          createImageBitmap(file, { colorSpaceConversion: "none" }),
        ])
          .then(([dispBmp, rawBmp]) => {
            const W = rawBmp.width,
              H = rawBmp.height;
            const raw = Object.assign(document.createElement("canvas"), {
              width: W,
              height: H,
            });
            const rctx = raw.getContext("2d", { willReadFrequently: true });
            rctx.drawImage(rawBmp, 0, 0);
            const px = rctx.getImageData(0, 0, W, H).data;
            rawBmp.close();
            // Rasterize dispBmp to a plain canvas immediately so the GPU-backed
            // ImageBitmap isn't held across long synchronous computations (e.g.
            // angle path sort for large images) where Chrome may reclaim idle
            // GPU textures, causing a later drawImage to throw "source detached".
            const dispCanvas = Object.assign(document.createElement("canvas"), { width: W, height: H });
            dispCanvas.getContext("2d").drawImage(dispBmp, 0, 0);
            dispBmp.close();
            const encImg = new Stegassette.Img(W, H, new Uint8Array(px));
            let decResult;
            try {
              decResult = Stegassette.decodeContainer(encImg, encImg);
            } catch (e) {
              pstatus.textContent = "✗ " + e.message;
              return;
            }
            const { entries, opts } = decResult;
            const B = opts.borderWidth;
            pstatus.textContent = "building path…";
            setTimeout(() => {
              const IW = W - 2 * B,
                IH = H - 2 * B;
              // Index-based path: Uint32Array of interior-local linear indices
              // (v = ly*IW + lx) — 4 bytes/pixel vs ~64 for an [x,y] tuple, the
              // difference between a few MB and multiple GB on large images.
              // Data pixel coords: dx = (v % IW) + B, dy = (v / IW | 0) + B.
              const pathIdx = Stegassette.getPathIndices(
                IW,
                IH,
                opts.traversal,
                opts.params || {},
              );
              const audioEntries = entries.filter((e) =>
                e.mimetype.startsWith("audio/"),
              );
              if (!audioEntries.length) {
                pstatus.textContent = "decoded — no audio entry";
                renderEntryList(entries);
                displayRow.style.display = "flex";
                reconCol.style.display = "none"; // no audio → no reconstruction
                const sc2 = Math.min(
                  1,
                  (window.innerWidth - 32) / W,
                  (window.innerHeight * 0.72) / H,
                );
                imgC.width = Math.round(W * sc2);
                imgC.height = Math.round(H * sc2);
                ovC.width = imgC.width;
                ovC.height = imgC.height;
                ic.drawImage(dispCanvas, 0, 0, imgC.width, imgC.height);
                return;
              }
              pstatus.textContent = "processing audio…";
              // bytes the channel plan writes per data pixel (was fixed 3; mono=1)
              const bytesPerPixel = opts.plan ? (opts.plan.bytesPerPixel || opts.plan.slots.length) : 3;
              setTimeout(() => {
                const tracks = audioEntries.map((audioEntry) => {
                  const { bits, rate, channels, layout, blockSize } =
                    Stegassette.parseAudioMime(audioEntry.mimetype);
                  const rawF32 = Stegassette.toFloat32(audioEntry.data, bits);
                  const planarF32 = Stegassette.unlayoutChannels({
                    f32: rawF32,
                    layout,
                    channels,
                    blockSize,
                  });
                  const dur = planarF32.length / (rate * channels);
                  const audioStartPxIdx = Math.floor(
                    audioEntry.dataOffset / bytesPerPixel,
                  );
                  const audioEndPxIdx = Math.ceil(
                    (audioEntry.dataOffset + audioEntry.data.length) /
                      bytesPerPixel,
                  );
                  const pathLen = audioEndPxIdx - audioStartPxIdx;
                  const revealOrder = Stegassette.computeRevealOrder({
                    pathLen,
                    channels,
                    bits,
                    layout,
                    blockSize,
                    bytesPerPixel,
                  });
                  return {
                    audioF32: planarF32,
                    audioSr: rate,
                    audioCh: channels,
                    audioBits: bits,
                    layout,
                    blockSize,
                    dur,
                    audioStartPxIdx,
                    audioEndPxIdx,
                    revealOrder,
                    fillIdx: -1,
                    loopCount: 0,
                  };
                });
                const { dur } = tracks[0];
                const {
                  audioSr: rate,
                  audioCh: channels,
                  audioBits: bits,
                } = tracks[0];
                const sc = Math.min(
                  1,
                  (window.innerWidth - 32) / W,
                  (window.innerHeight * 0.72) / H,
                );
                const dW = Math.round(W * sc),
                  dH = Math.round(H * sc);
                imgC.width = dW;
                imgC.height = dH;
                ovC.width = dW;
                ovC.height = dH;
                const encCanvas = Object.assign(document.createElement("canvas"), { width: dW, height: dH });
                const encCtx = encCanvas.getContext("2d");
                encCtx.drawImage(dispCanvas, 0, 0, dW, dH);
                // Clear border pixels from encCanvas; they'll show reconData from ic instead
                const bPx = B * sc;
                encCtx.clearRect(0, 0, dW, bPx);
                encCtx.clearRect(0, dH - bPx, dW, bPx);
                encCtx.clearRect(0, 0, bPx, dH);
                encCtx.clearRect(dW - bPx, 0, bPx, dH);
                const ps = Math.max(1, sc);
                const {
                  data: reconData,
                  width: reconW,
                  height: reconH,
                  // Was Stegassette.computeRecon(encImg, pathIdx, opts), which
                  // the bundle no longer exports — the call threw. The current
                  // name derives the path itself, so pathIdx is not passed.
                  // For a keyless encode this returns the border ring with the
                  // interior blanked: there is no cover held in key pixels to
                  // recover, so the reveal empties rather than develops.
                } = Stegassette.reconstructCover(encImg, opts);
                // Draw reconData as permanent base layer on ic; encoded image as overlay on oc.
                // reconData lives at its native resolution (full W×H, or half for
                // the real-only path) — drawn scaled up to the display canvas.
                const tmpRec = Object.assign(document.createElement("canvas"), {
                  width: reconW,
                  height: reconH,
                });
                tmpRec
                  .getContext("2d")
                  .putImageData(
                    new ImageData(new Uint8ClampedArray(reconData), reconW, reconH),
                    0,
                    0,
                  );
                // smooth scaling so the reveal animation doesn't look blocky
                // (half-res base scales up; full-res may scale down on big images).
                ic.imageSmoothingEnabled = true;
                ic.drawImage(tmpRec, 0, 0, dW, dH);
                oc.drawImage(encCanvas, 0, 0);
                // Static reconstructed-image preview beside the encoded one, at the
                // recon's native resolution (CSS scales the element to column width).
                reconC.width = reconW;
                reconC.height = reconH;
                rc.putImageData(
                  new ImageData(new Uint8ClampedArray(reconData), reconW, reconH),
                  0,
                  0,
                );
                reconCol.style.display = "";
                displayRow.style.display = "flex";
                pbar.style.display = "flex";
                clockEl.textContent = "0:00 / " + tt(dur);
                playBtn.disabled = false;
                reconBtn.disabled = false;
                const travArgStr =
                  opts.traversal === "angle"
                    ? ` (a=${opts.params?.a ?? 1} b=${opts.params?.b ?? 1})`
                    : opts.traversal === "fisher-yates"
                      ? ` (seed=${opts.params?.seed ?? "?"})`
                      : "";
                const trackStr =
                  tracks.length > 1 ? `  ·  ${tracks.length} tracks` : "";
                pstatus.textContent =
                  `${W}×${H}  ·  B=${B}  ·  ${opts.traversal}${travArgStr}  ·  ${opts.combine}  ·  ${opts.keymap}` +
                  `  ·  ${bits}bit ${rate}Hz ${channels}ch  ·  ${tt(dur)}${trackStr}`;
                const audioEndPxIdx = Math.max(...tracks.map((t) => t.audioEndPxIdx));
                const audioStartPxIdx = Math.min(...tracks.map((t) => t.audioStartPxIdx));
                pst = {
                  opts,
                  entries,
                  tracks,
                  pathIdx,
                  ps,
                  reconData,
                  reconW,
                  reconH,
                  px,
                  audioEndPxIdx,
                  audioStartPxIdx,
                  W,
                  H,
                  B,
                  IW,
                  IH,
                  sc,
                  dur,
                  encCanvas,
                  loopCount: 0,
                  fillIdx: -1,
                };
                renderEntryList(entries);
              }, 20);
            }, 20);
          })
          .catch((e) => {
            pstatus.textContent = "✗ " + e.message;
          });
      }

      // Clear the overlay rect for the data pixel + its key pixel at path
      // position `pi`, computing scaled coords on the fly from the index path
      // (no precomputed coords/keyCoords arrays — keeps big files in memory).
      function clearOverlayAt(st, pi) {
        const { pathIdx, IW, IH, B, sc, ps, opts } = st;
        const v = pathIdx[pi];
        const lx = v % IW,
          ly = (v / IW) | 0;
        oc.clearRect((lx + B) * sc, (ly + B) * sc, ps, ps);
        // Keyless has no paired key pixel to clear — every interior pixel is a
        // data pixel, so the checkerboard this pairing avoids cannot arise.
        if (Stegassette.KEYLESS_KEYMAPS.has(opts.keymap)) return;
        const [klx, kly] = Stegassette.KEYMAP[opts.keymap](lx, ly, IW, IH, opts.params || {});
        oc.clearRect((klx + B) * sc, (kly + B) * sc, ps, ps);
      }

      function fillNonAudioPixels(st) {
        const { audioStartPxIdx, audioEndPxIdx, pathIdx } = st;
        // Clear pre-audio pixels (entry table bytes)
        for (let i = 0; i < audioStartPxIdx; i++) clearOverlayAt(st, i);
        // Clear post-audio pixels (image larger than audio payload)
        for (let i = audioEndPxIdx; i < pathIdx.length; i++)
          clearOverlayAt(st, i);
      }

      function pplay() {
        if (!pst) return;
        if (!pactx) pactx = new AudioContext();
        if (pactx.state === "suspended") pactx.resume();
        pstop(false);
        const { tracks, encCanvas } = pst;
        pt0 = pactx.currentTime + 0.01;
        psrcs = [];
        for (const track of tracks) {
          const { audioF32, audioSr, audioCh } = track;
          const buf = pactx.createBuffer(
            audioCh,
            (audioF32.length / audioCh) | 0,
            audioSr,
          );
          for (let ch = 0; ch < audioCh; ch++) {
            const d = buf.getChannelData(ch);
            const off = ch * d.length;
            for (let i = 0; i < d.length; i++) d[i] = audioF32[off + i];
          }
          const src = pactx.createBufferSource();
          src.buffer = buf;
          src.loop = true;
          src.connect(pactx.destination);
          src.start(pt0);
          psrcs.push(src);
        }
        psrc = psrcs[0];
        oc.drawImage(encCanvas, 0, 0);
        pst.loopCount = 0;
        pst.fillIdx = -1;
        for (const t of tracks) {
          t.fillIdx = -1;
          t.loopCount = 0;
        }
        fillNonAudioPixels(pst);
        playBtn.disabled = true;
        stopBtn.disabled = false;
        praf = requestAnimationFrame(pframe);
      }

      function pstop(resetUI = true) {
        for (const src of psrcs) {
          try {
            src.stop();
          } catch (_) {}
        }
        psrcs = [];
        psrc = null;
        if (praf) {
          cancelAnimationFrame(praf);
          praf = null;
        }
        if (pst && pst.encCanvas) {
          oc.drawImage(pst.encCanvas, 0, 0);
          pst.fillIdx = -1;
        } else {
          oc.clearRect(0, 0, ovC.width, ovC.height);
        }
        if (resetUI && pst) {
          playBtn.disabled = false;
          stopBtn.disabled = true;
          clockEl.textContent = "0:00 / " + tt(pst.dur);
        }
      }

      function reconstruct() {
        if (!pst) return;
        const { reconData, reconW, reconH } = pst;
        const off = Object.assign(document.createElement("canvas"), {
          width: reconW,
          height: reconH,
        });
        off
          .getContext("2d")
          .putImageData(
            new ImageData(new Uint8ClampedArray(reconData), reconW, reconH),
            0,
            0,
          );
        off.toBlob((blob) => {
          const url = URL.createObjectURL(blob);
          Object.assign(document.createElement("a"), {
            href: url,
            download: "reconstructed.png",
          }).click();
          setTimeout(() => URL.revokeObjectURL(url), 1000);
        }, "image/png");
      }

      function pframe() {
        if (!pst || !psrc) return;
        const { dur, encCanvas, tracks } = pst;
        const raw = Math.max(0, pactx.currentTime - pt0);
        const primaryLoopN = dur > 0 ? Math.floor(raw / dur) : 0;
        if (primaryLoopN > pst.loopCount) {
          pst.loopCount = primaryLoopN;
          oc.drawImage(encCanvas, 0, 0);
          fillNonAudioPixels(pst);
          for (const t of tracks) {
            t.fillIdx = -1;
            t.loopCount = 0;
          }
        }
        clockEl.textContent = tt(dur > 0 ? raw % dur : raw) + " / " + tt(dur);
        for (const track of tracks) {
          const tDur = track.dur;
          if (tDur <= 0) continue;
          const tLoopN = Math.floor(raw / tDur);
          if (tLoopN > track.loopCount) {
            track.loopCount = tLoopN;
            track.fillIdx = -1;
          }
          const elapsed = raw % tDur;
          const pathLen = track.audioEndPxIdx - track.audioStartPxIdx;
          const revealIdx = Math.min(
            Math.floor((elapsed / tDur) * pathLen),
            pathLen - 1,
          );
          if (revealIdx + 1 > track.fillIdx) {
            const startI = Math.max(0, track.fillIdx);
            for (let i = startI; i <= revealIdx; i++) {
              const pi = track.audioStartPxIdx + track.revealOrder[i];
              clearOverlayAt(pst, pi);
            }
            track.fillIdx = revealIdx + 1;
          }
        }
        praf = requestAnimationFrame(pframe);
      }

      // ═══════════════════════════════════════════════════════════════════
      // ENCODER
      // ═══════════════════════════════════════════════════════════════════

      let encImgFile = null;
      let encAudioBuf = null;
      let encAudioName = null;
      let encActx = null;
      let encVideoFile = null;
      let encFrameCanvases = [];
      let encFrameBlobUrl = null;
      let vScrubT = 0;
      let trimAbsS = 0,
        trimAbsE = 0;
      let zoomF0 = 0,
        zoomF1 = 1;
      let prevSrc = null,
        prevRaf = null,
        prevGen = 0;
      let lastBlobUrl = null;

      const idrop = document.getElementById("idrop");
      const ifi = document.getElementById("ifi");
      const adrop = document.getElementById("adrop");
      const afi = document.getElementById("afi");
      const waveSection = document.getElementById("waveSection");
      const addlRows = document.getElementById("addlRows");
      const trackRows = document.getElementById("trackRows");
      const addTextBtn = document.getElementById("addTextBtn");
      const addFileBtn = document.getElementById("addFileBtn");
      const addTrackBtn = document.getElementById("addTrackBtn");
      const waveCoarse = document.getElementById("waveCoarse");
      const waveFine = document.getElementById("waveFine");
      const zoomS = document.getElementById("zoomS");
      const zoomE = document.getElementById("zoomE");
      const zoomFill = document.getElementById("zoomFill");
      const trimS = document.getElementById("trimS");
      const trimE = document.getElementById("trimE");
      const trimFill = document.getElementById("trimFill");
      const trimStartN = document.getElementById("trimStartN");
      const trimEndN = document.getElementById("trimEndN");
      const trimDurEl = document.getElementById("trimDur");
      const prevPlayBtn = document.getElementById("prevPlayBtn");
      const prevStopBtn = document.getElementById("prevStopBtn");
      const eSrEl = document.getElementById("eSr");
      const eChEl = document.getElementById("eCh");
      const eLayoutEl = document.getElementById("eLayout");
      const eBlockSizeEl = document.getElementById("eBlockSize");
      const eLayoutWrap = document.getElementById("eLayoutWrap");
      const eBitsEl = document.getElementById("eBits");
      const eDirEl = document.getElementById("eDir");
      const eModeEl = document.getElementById("eMode");
      const eNormEl = document.getElementById("eNorm");
      const speedHint = document.getElementById("speedHint");
      const sizeHint = document.getElementById("sizeHint");
      const eTraversal = document.getElementById("eTraversal");
      const eKeymap = document.getElementById("eKeymap");
      const travParams = document.getElementById("travParams");
      const encBtn = document.getElementById("encBtn");
      const dlBtn = document.getElementById("dlBtn");
      const estats = document.getElementById("estats");
      const framePickerSection = document.getElementById("framePickerSection");
      const frameVideoEl = document.getElementById("frameVideo");
      const framePreviewEl = document.getElementById("framePreview");
      const vScrub = document.getElementById("vScrub");
      const vTimeEl = document.getElementById("vTimeEl");
      const captureFrameBtn = document.getElementById("captureFrameBtn");
      const clearFramesBtn = document.getElementById("clearFramesBtn");
      const mosaicLayoutEl = document.getElementById("mosaicLayout");
      const frameThumbsEl = document.getElementById("frameThumbs");
      const eAspect = document.getElementById("eAspect");
      const eAspectCustom = document.getElementById("eAspectCustom");
      const eAspectWEl = document.getElementById("eAspectW");
      const eAspectHEl = document.getElementById("eAspectH");
      const eBorderEl = document.getElementById("eBorder");
      const reconLabel = document.getElementById("reconLabel");

      // ── capture mode ──────────────────────────────────────────────────
      // data | clip | series | video. One rig, four sources: the mode decides
      // which capture UI is live, what encode does with the audio, and which
      // shape `copy as json` emits. It is never stored in the JSON — a loaded
      // job's mode is DERIVED (StegassetteJobs.jobMode) so the two can't disagree.
      const modeBar = document.getElementById("modeBar");
      const modeNote = document.getElementById("modeNote");
      const MODE_NOTES = {
        data: "no audio · image + entries = a data-only cartridge",
        clip: "one image · one trimmed audio clip",
        series: "one audio divided across several images, each with its own text",
        video: "stills grabbed off a video, tiled into the cover",
      };
      const MODE_DROP = {
        data: ["image", "PNG · JPG · WEBP…"],
        clip: ["image", "PNG · JPG · WEBP…"],
        series: ["images", "drop one per chunk — assign them below"],
        video: ["video", "MP4 · MOV · WEBM…"],
      };
      let encMode = "clip";

      function setMode(m) {
        if (!MODE_NOTES[m]) m = "clip";
        encMode = m;
        document.body.dataset.mode = m;
        for (const b of modeBar.querySelectorAll("button[data-mode]"))
          b.setAttribute("aria-selected", b.dataset.mode === m);
        modeNote.textContent = MODE_NOTES[m];
        const [lbl, sub] = MODE_DROP[m];
        if (!idrop.hasAttribute("data-ready"))
          idrop.innerHTML = `<span class="drop__label">${lbl}</span><span class="drop__sub">${sub}</span>`;
        ifi.accept = m === "video" ? "video/*" : "image/*";
        // series wants a whole set of covers at once
        ifi.multiple = m === "series";
        renderChunks();
        checkEncReady();
        updateSizeHint();
        drawWaveforms();
      }
      modeBar.addEventListener("click", (e) => {
        const b = e.target.closest("button[data-mode]");
        if (b) setMode(b.dataset.mode);
      });

      // ── channel plan controls ─────────────────────────────────────────
      // One ordered list of slots == the JSON `channels` array. Each slot is a
      // distinct active channel (R/G/B) + its combine op; row order = slot order.
      // `pack` is the only other field. There is no separate global combine —
      // "all" is just a bulk setter over the rows.
      const ePack = document.getElementById("ePack");
      const packHint = document.getElementById("packHint");
      const chanPlanRows = document.getElementById("chanPlanRows");
      const eAllCombine = document.getElementById("eAllCombine");
      const chanAddBtn = document.getElementById("chanAddBtn");
      const CH_COLOR = { r: "#e66", g: "#6e6", b: "#66e" };

      eAllCombine.innerHTML = StegassetteJobs.ENUMS.combine
        .map((n) => `<option>${n}</option>`)
        .join("");

      // chanPlan is the source of truth: [{ ch:"r"|"g"|"b", combine }]
      let chanPlan = ["r", "g", "b"].map((ch) => ({ ch, combine: "xor" }));

      function bytesPerSampleUI() {
        return Math.min(Math.max(1, (parseInt(eBitsEl.value) || 16) >> 3), 3);
      }
      // aligned forces exactly N distinct slots (N = bytes/sample)
      function syncAlignedCount() {
        if (ePack.value !== "aligned") return;
        const n = bytesPerSampleUI();
        while (chanPlan.length > n) chanPlan.pop();
        while (chanPlan.length < n) {
          const used = new Set(chanPlan.map((s) => s.ch));
          const next = ["r", "g", "b"].find((c) => !used.has(c));
          chanPlan.push({ ch: next, combine: eAllCombine.value });
        }
      }

      function onPlanChange() {
        updateReconLabel?.();
        updateSizeHint?.();
      }

      function renderChanPlan() {
        if (ePack.value === "mono") {
          chanPlanRows.innerHTML = "";
          chanAddBtn.disabled = true;
          chanAddBtn.style.opacity = 0.4;
          packHint.textContent = "mono · 1 byte/pixel → R=G=B (luminance ghost)";
          return;
        }
        syncAlignedCount();
        const aligned = ePack.value === "aligned";
        chanPlanRows.innerHTML = "";
        chanPlan.forEach((slot, i) => {
          const row = document.createElement("div");
          row.className = "chan-row";
          const chSel = StegassetteJobs.ENUMS.channel
            .map(
              (c) =>
                `<option value="${c}"${c === slot.ch ? " selected" : ""}>${c.toUpperCase()}</option>`,
            )
            .join("");
          const cmSel = StegassetteJobs.ENUMS.combine
            .map(
              (n) =>
                `<option${n === slot.combine ? " selected" : ""}>${n}</option>`,
            )
            .join("");
          row.innerHTML =
            `<span class="ch-dot" style="background:${CH_COLOR[slot.ch]}"></span>` +
            `<select class="cr-ch">${chSel}</select>` +
            `<select class="cr-cm">${cmSel}</select>` +
            `<button class="cr-up" type="button" title="move up"${i === 0 ? " disabled" : ""}>▲</button>` +
            `<button class="cr-dn" type="button" title="move down"${i === chanPlan.length - 1 ? " disabled" : ""}>▼</button>` +
            `<button class="cr-rm" type="button" title="remove"${chanPlan.length <= 1 || aligned ? " disabled" : ""}>✕</button>`;
          row.querySelector(".cr-ch").addEventListener("change", (e) => {
            const v = e.target.value;
            const j = chanPlan.findIndex((s, k) => k !== i && s.ch === v);
            if (j >= 0) chanPlan[j].ch = slot.ch; // keep channels distinct (swap)
            slot.ch = v;
            renderChanPlan();
            onPlanChange();
          });
          row.querySelector(".cr-cm").addEventListener("change", (e) => {
            slot.combine = e.target.value;
            renderChanPlan();
            onPlanChange();
          });
          row.querySelector(".cr-up").addEventListener("click", () => {
            [chanPlan[i - 1], chanPlan[i]] = [chanPlan[i], chanPlan[i - 1]];
            renderChanPlan();
            onPlanChange();
          });
          row.querySelector(".cr-dn").addEventListener("click", () => {
            [chanPlan[i + 1], chanPlan[i]] = [chanPlan[i], chanPlan[i + 1]];
            renderChanPlan();
            onPlanChange();
          });
          row.querySelector(".cr-rm").addEventListener("click", () => {
            chanPlan.splice(i, 1);
            renderChanPlan();
            onPlanChange();
          });
          chanPlanRows.appendChild(row);
        });
        chanAddBtn.disabled = aligned || chanPlan.length >= 3;
        chanAddBtn.style.opacity = chanAddBtn.disabled ? 0.4 : 1;
        packHint.textContent = aligned
          ? `aligned · ${chanPlan.length} ch/sample (1 sample → 1 pixel)`
          : `packed · ${chanPlan.length}/3 ch · ${Math.round((chanPlan.length / 3) * 100)}% density`;
        // The per-slot selects are rebuilt here, so whatever a keyless keymap
        // disabled has to be re-applied to the fresh options.
        updateCombineAvailability?.();
      }

      chanAddBtn.addEventListener("click", () => {
        if (chanPlan.length >= 3 || ePack.value === "aligned") return;
        const used = new Set(chanPlan.map((s) => s.ch));
        const next = ["r", "g", "b"].find((c) => !used.has(c));
        chanPlan.push({ ch: next, combine: eAllCombine.value });
        renderChanPlan();
        onPlanChange();
      });
      eAllCombine.addEventListener("change", () => {
        for (const s of chanPlan) s.combine = eAllCombine.value;
        renderChanPlan();
        onPlanChange();
      });
      ePack.addEventListener("change", () => {
        renderChanPlan();
        onPlanChange();
      });
      eBitsEl.addEventListener("change", () => {
        renderChanPlan();
        onPlanChange();
      });
      renderChanPlan();

      // channels array + pack, straight from chanPlan
      function gatherChannelPlan() {
        if (ePack.value === "mono") return { pack: "mono", channels: null };
        return {
          pack: ePack.value,
          channels: chanPlan.map((s) => ({ ch: s.ch, combine: s.combine })),
        };
      }
      // representative combine — for the recon-quality hint + clean-JSON default
      function representativeCombine() {
        return chanPlan[0] ? chanPlan[0].combine : "xor";
      }
      // true when the plan is the simple default (packed, r,g,b, one combine)
      function isSimplePlan() {
        if (ePack.value === "mono") return false;
        return (
          ePack.value === "packed" &&
          chanPlan.length === 3 &&
          chanPlan.every((s, i) => s.ch === ["r", "g", "b"][i]) &&
          chanPlan[0].combine === chanPlan[1].combine &&
          chanPlan[1].combine === chanPlan[2].combine
        );
      }
      // load chanPlan from a parsed channels array (indices or letters)
      function setChanPlan(slots) {
        const letters = ["r", "g", "b"];
        chanPlan = slots.map((s) => ({
          ch: typeof s.ch === "number" ? letters[s.ch] : s.ch,
          combine: s.combine || "xor",
        }));
        if (!chanPlan.length) chanPlan = [{ ch: "r", combine: "xor" }];
        eAllCombine.value = chanPlan[0].combine;
        renderChanPlan();
      }

      // ── canonical config (same schema as jobs/*.json) ─────────────────
      // applyConfig writes a parsed job back into the form; gatherJobJSON (below)
      // is the inverse, serializing the form. Units are ms (trim) for batch jobs.
      function setSel(el, val) {
        if (el && val != null) el.value = String(val);
      }
      function applyConfig(job) {
        // the mode a job describes is derived, not stored — see StegassetteJobs.jobMode
        setMode(StegassetteJobs.jobMode(job));
        // audio settings live in the first audio entry (batch format), the
        // `split` block (series), or top-level (ui format)
        const audioEnt = jobAudioEntry(job);
        const j = { ...StegassetteJobs.DEFAULTS, ...job, ...(audioEnt || {}) };
        setSel(eSrEl, j.sr);
        setSel(eChEl, j.ch);
        setSel(eBitsEl, j.bits);
        setSel(eDirEl, j.dir);
        setSel(eModeEl, j.mode);
        {
          const nd = StegassetteJobs.resolveNormalize(j.normalize);
          eNormEl.value = nd == null ? "off" : String(nd);
        }
        setSel(eLayoutEl, j.layout);
        setSel(eBlockSizeEl, j.blockSize);
        setSel(eTraversal, j.traversal);
        setSel(eKeymap, j.keymap);
        updateKeymapParams?.();
        if (j.keymap === "offset") {
          const kxEl = document.getElementById("ekx");
          const kyEl = document.getElementById("eky");
          if (kxEl) kxEl.value = j.kx ?? 0;
          if (kyEl) kyEl.value = j.ky ?? 0;
        }
        updateCombineAvailability?.();
        setSel(eBorderEl, j.border);
        // aspect
        if (Array.isArray(j.aspect)) {
          eAspect.value = "custom";
          eAspectWEl.value = j.aspect[0];
          eAspectHEl.value = j.aspect[1];
        } else setSel(eAspect, j.aspect || "original");
        eAspect.dispatchEvent(new Event("change"));
        // channel plan — explicit `channels` if present, else the simple default
        // (all R,G,B with `combine`); resolveConfig handles aligned auto-count.
        setSel(ePack, j.pack || "packed");
        const resolved = StegassetteJobs.resolveConfig(j).encodeOpts;
        const plan = Stegassette.normalizeChannelPlan(
          resolved,
          (parseInt(j.bits, 10) >> 3) || 3,
          0,
        );
        setChanPlan(plan.slots);
        updateLayoutVisibility?.();
        updateTravParams?.();
        updateReconLabel?.();
        // shared text entries — from split.entries (series; they go on every
        // chunk), job.entries (batch format), or job.texts (ui format)
        clearTextEntries();
        const splitSpec0 = StegassetteJobs.splitSpec(job);
        const sharedSrc = splitSpec0
          ? splitSpec0.entries
          : Array.isArray(job.entries)
            ? job.entries
            : j.texts;
        const textItems = Array.isArray(sharedSrc)
          ? sharedSrc.filter((e) => typeof e === "string" || e.text != null)
          : [];
        for (const t of textItems)
          typeof t === "string"
            ? addTextEntry("", t)
            : addTextEntry(t.name || "", t.text || "");
        // trim (ms) — only applies once audio is loaded; inputs are already ms
        if (encAudioBuf && j.start != null) {
          trimStartN.value = j.start;
          trimEndN.value =
            j.end != null ? j.end : Math.round(encAudioBuf.duration * 1000);
          applyManualTrim();
        }
        // video stills — the layout applies now, the grabs once the video loads
        const fr = StegassetteJobs.framesSpec(job);
        if (fr) {
          mosaicLayoutEl.value = fr.layout;
          pendingFrames = fr.at;
          if (frameVideoEl.readyState >= 1) captureFramesAt(fr.at);
        }
        // series — a `split` block becomes the chunk rows
        const spec = StegassetteJobs.splitSpec(job);
        if (spec) applySplitToChunks(spec);
        else if (encMode !== "series") {
          chunks = [];
          chunkSel = -1;
          seriesWin = null;
        }
      }

      // ── single-job export (jobs/*.json entry shape) ───────────────────
      // Serialize the form into one batch job: image/steg settings at the top
      // level, audio settings + texts nested in an ordered `entries` array (the
      // audio entry first, carrying `path`). image/out/audio paths come from the
      // selected job when one is loaded, else from the dropped filenames.
      function gatherJobJSON() {
        const selJob = jobSel >= 0 && jobsArray ? jobsArray[jobSel] : null;

        // top-level: image/out paths, then steg/image settings
        const job = {};
        const imagePath =
          selJob?.image || encImgFile?.name || encVideoFile?.name || null;
        if (imagePath) job.image = imagePath;
        if (selJob?.out) job.out = selJob.out;
        job.combine = representativeCombine();
        job.traversal = eTraversal.value;
        // traversal params — hyphenated to match the jobs/*.json convention
        if (eTraversal.value === "angle") {
          job["angle-a"] =
            parseInt(document.getElementById("eangle-a")?.value, 10) || 1;
          job["angle-b"] =
            parseInt(document.getElementById("eangle-b")?.value, 10) || 1;
        } else if (eTraversal.value === "fisher-yates") {
          const sv = document.getElementById("eFySeed")?.value.trim();
          if (sv) job.seed = parseInt(sv, 10) >>> 0;
        }
        job.keymap = eKeymap.value;
        if (eKeymap.value === "offset") {
          job.kx = parseInt(document.getElementById("ekx")?.value, 10) | 0;
          job.ky = parseInt(document.getElementById("eky")?.value, 10) | 0;
        }
        job.border = parseFloat(eBorderEl.value) || 0;
        job.aspect =
          eAspect.value === "custom"
            ? [parseFloat(eAspectWEl.value) || 16, parseFloat(eAspectHEl.value) || 9]
            : eAspect.value;
        // explicit channel plan only when it isn't the simple default — keeps
        // common jobs clean (just `combine`) and matches hand-authored JSON
        if (!isSimplePlan()) {
          const { pack, channels } = gatherChannelPlan();
          job.pack = pack;
          job.channels = channels;
        }

        // video mode: the cover is stills off the video, so record which ones.
        // `image` already points at the video file.
        if (encMode === "video" && encFrameCanvases.length) {
          job.frames = {
            at: encFrameCanvases.map((f) => Math.round(f.time * 1000)),
            layout: mosaicLayoutEl.value,
          };
        }

        // text entries → { name, text }
        const textEntries = addlEntries
          .filter((e) => e.isText)
          .map((e) => ({ name: e.name || "", text: e.textEl ? e.textEl.value : "" }));

        // data mode: no audio at all — a data-only cartridge
        if (encMode === "data") {
          job.entries = textEntries;
          return job;
        }

        // audio entry: `path` first (if known), then the audio settings.
        // layout/blockSize only matter for multi-channel / block layout.
        const ch = parseInt(eChEl.value) || 1;
        const layout = eLayoutEl.value;
        const audioPath =
          (selJob && jobAudioEntry(selJob)?.path) || encAudioName || null;
        const audioEntry = {};
        if (audioPath) audioEntry.path = audioPath;
        audioEntry.start = Math.round((trimAbsS || 0) * 1000);
        audioEntry.end = trimAbsE != null ? Math.round(trimAbsE * 1000) : null;
        audioEntry.sr = parseInt(eSrEl.value) || 22050;
        audioEntry.ch = ch;
        audioEntry.bits = parseInt(eBitsEl.value) || 16;
        audioEntry.dir = eDirEl.value;
        audioEntry.mode = eModeEl.value;
        audioEntry.normalize =
          eNormEl.value === "off" ? null : parseFloat(eNormEl.value);
        if (ch > 1) {
          audioEntry.layout = layout;
          if (layout === "block")
            audioEntry.blockSize = parseInt(eBlockSizeEl.value) || 64;
        }

        job.entries = [audioEntry, ...textEntries];
        return job;
      }

      // ── series export ─────────────────────────────────────────────────
      // The chunk editor's own JSON shape. gatherChunkSplit writes the compact
      // `split` block; the expanded array comes from running the job schema's OWN
      // expander over it, so what the editor shows and what encode-batch does
      // can never drift apart.
      function seriesOutBase() {
        const selJob = jobSel >= 0 && jobsArray ? jobsArray[jobSel] : null;
        const spec = selJob && StegassetteJobs.splitSpec(selJob);
        if (spec?.out) return StegassetteJobs.outBase(spec.out);
        if (selJob?.out) return StegassetteJobs.outBase(selJob.out);
        return (encAudioName || "series").replace(/\.[^.]+$/, "");
      }
      function chunkOutName(c, i) {
        return c.out || `${seriesOutBase()}-${String(i + 1).padStart(2, "0")}`;
      }
      function gatherChunkSplit() {
        const base = gatherJobJSON();
        const entries = base.entries || [];
        const audioEntry = entries.find(StegassetteJobs.isAudioEntry) || {};
        const shared = entries.filter((e) => e !== audioEntry);

        const job = { ...base };
        delete job.entries;
        delete job.image; // covers are per-chunk
        job.out = seriesOutBase();

        const split = { path: audioEntry.path || encAudioName || null };
        for (const k of StegassetteJobs.SPLIT_AUDIO_KEYS)
          if (audioEntry[k] !== undefined) split[k] = audioEntry[k];
        const win = seriesWindow();
        split.start = Math.round(win.s * 1000);
        split.end = Math.round(win.e * 1000);
        if (shared.length) split.entries = shared;
        split.parts = chunks.map((c, i) => {
          const p = {
            start: Math.round(c.s * 1000),
            end: Math.round(c.e * 1000),
          };
          if (c.image) p.image = c.image;
          if (c.out) p.out = c.out;
          if (c.name) p.name = c.name;
          if (c.entries.length)
            p.entries = c.entries.map((e) => ({
              name: e.name || "",
              text: e.text || "",
            }));
          return p;
        });
        job.split = split;
        return job;
      }
      function gatherChunkJobs() {
        return StegassetteJobs.expandJob(gatherChunkSplit(), {
          durationMs: encAudioBuf ? encAudioBuf.duration * 1000 : null,
          srcSr: encAudioBuf ? encAudioBuf.sampleRate : null,
          bytesPerPixel: uiBytesPerPixel(),
        });
      }

      // clipboard write with a file:// fallback (no navigator.clipboard there)
      async function copyText(text) {
        try {
          await navigator.clipboard.writeText(text);
          return true;
        } catch (_) {}
        try {
          const ta = document.createElement("textarea");
          ta.value = text;
          ta.style.cssText = "position:fixed;top:0;left:0;opacity:0";
          document.body.appendChild(ta);
          ta.select();
          const ok = document.execCommand("copy");
          ta.remove();
          return ok;
        } catch (_) {
          return false;
        }
      }

      const copyJsonBtn = document.getElementById("copyJsonBtn");
      copyJsonBtn.addEventListener("click", async () => {
        // in series mode the job IS the split block
        const payload =
          encMode === "series" && chunks.length
            ? gatherChunkSplit()
            : gatherJobJSON();
        const ok = await copyText(JSON.stringify(payload, null, 2));
        const prev = copyJsonBtn.textContent;
        copyJsonBtn.textContent = ok ? "copied ✓" : "copy failed";
        setTimeout(() => {
          copyJsonBtn.textContent = prev;
        }, 1200);
      });

      // ── jobs queue ────────────────────────────────────────────────────
      // Drop a jobs array → a clickable list. Selecting an item loads its
      // settings + texts into the form and auto-attaches any image/audio whose
      // filename matches a file you've dropped; "copy as json" exports it back.
      const jobsPanel = document.getElementById("jobsPanel");
      const jobsList = document.getElementById("jobsList");
      const jobsTitle = document.getElementById("jobsTitle");
      const jobsMsg = document.getElementById("jobsMsg");
      let jobsArray = null;
      let jobSel = -1;
      const droppedFiles = new Map(); // basename → File (for auto-attach)
      // set by selectJob before an audio attach so onAudioLoaded can re-apply the
      // job on top of the natural sr/ch/trim reset that decoding triggers
      let pendingJobConfig = null;

      const baseName = (p) => (p ? String(p).split(/[\\/]/).pop() : "");

      function stashDroppedFile(file) {
        droppedFiles.set(file.name, file);
        renderChunks(); // refresh the per-chunk cover pickers
        if (!jobsArray) return;
        renderJobsList(); // refresh availability ticks
        // if this completes a source for the selected job, (re)attach it now
        if (jobSel >= 0) {
          const { img, aud, covers } = jobFilesStatus(jobsArray[jobSel]);
          if (
            file.name === img ||
            file.name === aud ||
            (covers && covers.includes(file.name))
          )
            selectJob(jobSel);
        }
      }

      function loadJobsArray(arr) {
        jobsArray = arr.slice();
        jobSel = -1;
        jobsPanel.hidden = false;
        renderJobsList();
      }

      // The job's audio source + its settings. A `split` job keeps them on the
      // split block itself (every chunk shares them), so it stands in here.
      function jobAudioEntry(job) {
        const spec = StegassetteJobs.splitSpec(job);
        if (spec) return spec.path ? spec : null;
        return (
          (Array.isArray(job.entries) ? job.entries : []).find(
            StegassetteJobs.isAudioEntry,
          ) || null
        );
      }

      function jobFilesStatus(job) {
        const audioEnt = jobAudioEntry(job);
        const aud = audioEnt ? baseName(audioEnt.path) : baseName(job.audio);
        const haveAud = aud && droppedFiles.has(aud);
        // a split job has no single cover — it wants one per chunk, so report
        // the set rather than nagging about a top-level `image` it never has
        const spec = StegassetteJobs.splitSpec(job);
        if (spec) {
          const covers = splitCoverNames(spec).map(baseName);
          const have = covers.filter((c) => droppedFiles.has(c)).length;
          return {
            img: covers.length ? `${have}/${covers.length} covers` : "",
            aud,
