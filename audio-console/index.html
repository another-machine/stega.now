<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>stegassette/audio-console has moved</title>
    <!-- The audio console became /album, and /album is gone. Releases is
         where encoded albums live now, so this forwards there. The path was
         served and has been shared, so it forwards rather than 404s. Same
         reasoning as the redirects in public-library: GitHub Pages has no
         _redirects equivalent, so it is a real page with a meta refresh and a
         canonical link. -->
    <meta http-equiv="refresh" content="0; url=https://stega.now/releases/" />
    <link rel="canonical" href="https://stega.now/releases/" />
    <meta name="robots" content="noindex" />
    <style>
      body { background:#000; color:#eee; font:14px/1.6 ui-monospace,monospace;
             display:grid; place-items:center; min-height:100vh; margin:0; }
      a { color:#8cf; }
    </style>
  </head>
  <body>
    <p>stegassette/audio-console is now at <a href="https://stega.now/releases/">https://stega.now/releases/</a>.</p>
  </body>
</html>
