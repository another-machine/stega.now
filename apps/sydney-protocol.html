<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sydney Protocol</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --night:#0E1330;
  --deep:#1A2150;
  --paper:#EDEFF7;
  --ink:#141A38;
  --amber:#EF9B2F;
  --amber-soft:#FFF0D6;
  --moon:#8C9AD6;
  --rose:#D8456B;
  --line:rgba(20,26,56,.14);
  --bg:var(--paper);
  --fg:var(--ink);
  --card:#fff;
  --muted:rgba(20,26,56,.55);
  --rail-day:var(--amber);
  --rail-night:var(--moon);
}
body.night{
  --bg:var(--night);
  --fg:#DDE3FA;
  --card:#161C42;
  --muted:rgba(221,227,250,.5);
  --line:rgba(221,227,250,.14);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg);color:var(--fg);
  font-family:'IBM Plex Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  font-size:15px;line-height:1.45;
  transition:background .6s ease,color .6s ease;
  padding-bottom:56px;
}
.mono{font-family:'IBM Plex Mono',ui-monospace,Menlo,monospace;font-variant-numeric:tabular-nums}
.disp{font-family:'Barlow Condensed','Oswald','Arial Narrow',sans-serif;text-transform:uppercase;letter-spacing:.045em;font-weight:700;line-height:1}
.wrap{max-width:640px;margin:0 auto;padding:0 16px}

/* ---- clock bar ---- */
header{
  position:sticky;top:0;z-index:20;background:var(--bg);
  border-bottom:1px solid var(--line);transition:background .6s ease;
}
.clocks{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);
  border-left:1px solid var(--line);border-right:1px solid var(--line)}
.clock{background:var(--bg);padding:9px 10px 8px;text-align:left;transition:background .6s ease}
.clock .city{font-size:10px;letter-spacing:.16em;color:var(--muted);font-weight:600}
.clock .t{font-size:19px;font-weight:600;margin-top:1px}
.clock .d{font-size:10px;color:var(--muted);letter-spacing:.05em}
.clock.here .city{color:var(--amber)}
.clock.here{box-shadow:inset 0 -2px 0 var(--amber)}

/* ---- now card ---- */
.now{padding:20px 0 22px}
.eyebrow{font-size:10px;letter-spacing:.22em;color:var(--muted);font-weight:600;display:flex;gap:8px;align-items:center}
.dot{width:6px;height:6px;border-radius:50%;background:var(--rose);animation:pulse 2.4s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
.now h1{font-size:clamp(34px,10vw,52px);margin:8px 0 0}
.now .sub{margin:8px 0 0;font-size:15px;max-width:34ch}
.now .meta{margin-top:14px;font-size:12px;color:var(--muted);letter-spacing:.04em}
.bar{height:5px;border-radius:99px;background:var(--line);margin-top:10px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--amber);border-radius:99px;transition:width 1s linear}
body.night .bar i{background:var(--moon)}
.next{margin-top:18px;padding-top:14px;border-top:1px solid var(--line);
  display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.next .lbl{font-size:10px;letter-spacing:.2em;color:var(--muted);font-weight:600}
.next .txt{font-size:14px;font-weight:500;margin-top:3px}
.next .cd{font-size:20px;font-weight:600;white-space:nowrap}

/* ---- controls ---- */
.controls{display:flex;gap:8px;align-items:center;padding:0 0 14px;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:99px;overflow:hidden}
.seg button{background:none;border:0;color:var(--muted);font:inherit;font-size:11px;font-weight:600;
  letter-spacing:.1em;text-transform:uppercase;padding:7px 12px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.ghost{background:none;border:1px solid var(--line);color:var(--muted);font:inherit;font-size:11px;
  font-weight:600;letter-spacing:.1em;text-transform:uppercase;padding:7px 12px;border-radius:99px;cursor:pointer}

/* ---- timeline ---- */
.daygrp{margin-bottom:4px}
.dayhead{position:sticky;top:66px;z-index:10;background:var(--bg);padding:16px 0 7px;
  display:flex;align-items:baseline;gap:10px;transition:background .6s ease}
.dayhead .dl{font-size:19px}
.dayhead .dz{font-size:10px;letter-spacing:.16em;color:var(--muted);font-weight:600}
.dayhead .strip{flex:1;height:3px;border-radius:2px;min-width:40px}

.ev{display:grid;grid-template-columns:14px 62px 1fr 34px;gap:10px;align-items:start;
  padding:11px 0;border-top:1px solid var(--line)}
.rail{width:4px;border-radius:2px;height:100%;min-height:34px;margin-left:5px;opacity:.85}
.ev .time{font-size:14px;font-weight:600;padding-top:1px}
.ev .alt{font-size:10px;color:var(--muted);letter-spacing:.02em;display:block;margin-top:2px}
.ev .body .tag{font-size:9px;letter-spacing:.16em;font-weight:600;display:inline-block;
  padding:2px 6px;border-radius:3px;margin-bottom:5px}
.ev .body h3{margin:0;font-size:15px;font-weight:600;line-height:1.3}
.ev .body p{margin:3px 0 0;font-size:13px;color:var(--muted);line-height:1.4}
.ev .body .dur{font-size:11px;color:var(--muted);margin-top:4px;letter-spacing:.05em}
.warn{display:block;margin-top:7px;font-size:12px;padding:7px 9px;border-radius:5px;
  background:rgba(216,69,107,.1);border-left:2px solid var(--rose);color:var(--fg);line-height:1.35}
.tick{width:26px;height:26px;border-radius:7px;border:1.5px solid var(--line);background:none;
  cursor:pointer;display:grid;place-items:center;padding:0;margin-top:2px;flex-shrink:0}
.tick svg{width:14px;height:14px;stroke:var(--fg);stroke-width:2.6;fill:none;opacity:0;
  stroke-linecap:round;stroke-linejoin:round;transition:opacity .15s}
.ev.done .tick{background:var(--fg);border-color:var(--fg)}
.ev.done .tick svg{stroke:var(--bg);opacity:1}
.ev.done .body h3,.ev.done .time{opacity:.35;text-decoration:line-through;text-decoration-thickness:1px}
.ev.done .body p,.ev.done .body .tag{opacity:.35}
.ev.live{background:linear-gradient(90deg,rgba(239,155,47,.13),transparent 70%);
  margin:0 -12px;padding-left:12px;padding-right:12px;border-radius:8px;border-top-color:transparent}
body.night .ev.live{background:linear-gradient(90deg,rgba(140,154,214,.16),transparent 70%)}
.ev.past:not(.done) .time,.ev.past:not(.done) .body{opacity:.5}

.t-sleep{background:rgba(140,154,214,.18);color:var(--moon)}
.t-light{background:rgba(239,155,47,.2);color:#B36F0A}
body.night .t-light{color:var(--amber)}
.t-flight{background:rgba(20,26,56,.09);color:var(--muted)}
body.night .t-flight{background:rgba(221,227,250,.1)}
.t-crit{background:rgba(216,69,107,.15);color:var(--rose)}

footer{padding:26px 0 40px;font-size:12px;color:var(--muted);line-height:1.5;border-top:1px solid var(--line);margin-top:24px}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:12px;font-size:10px;letter-spacing:.12em;font-weight:600}
.legend span{display:flex;align-items:center;gap:5px}
.legend i{width:16px;height:4px;border-radius:2px;display:block}
#jump{position:fixed;right:14px;bottom:14px;z-index:30;background:var(--fg);color:var(--bg);
  border:0;border-radius:99px;padding:11px 17px;font:inherit;font-size:11px;font-weight:700;
  letter-spacing:.14em;text-transform:uppercase;cursor:pointer;box-shadow:0 6px 22px rgba(0,0,0,.3)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
:focus-visible{outline:2px solid var(--amber);outline-offset:3px;border-radius:4px}
</style>
</head>
<body>

<header>
  <div class="clocks" id="clocks"></div>
</header>

<div class="wrap">

  <section class="now" id="nowcard">
    <div class="eyebrow"><span class="dot"></span><span id="nowlabel">RIGHT NOW</span></div>
    <h1 class="disp" id="nowtitle">—</h1>
    <p class="sub" id="nowsub"></p>
    <div class="meta mono" id="nowmeta"></div>
    <div class="bar"><i id="nowbar" style="width:0%"></i></div>
    <div class="next">
      <div>
        <div class="lbl">NEXT</div>
        <div class="txt" id="nexttxt">—</div>
      </div>
      <div class="cd mono" id="nextcd">—</div>
    </div>
  </section>

  <div class="controls">
    <div class="seg" role="group" aria-label="Time zone display">
      <button data-z="auto" aria-pressed="true">Auto</button>
      <button data-z="America/Chicago" aria-pressed="false">Chicago</button>
      <button data-z="Australia/Sydney" aria-pressed="false">Sydney</button>
    </div>
    <button class="ghost" id="hidedone" aria-pressed="false">Hide done</button>
    <button class="ghost" id="reset">Reset</button>
  </div>

  <main id="timeline"></main>

  <footer>
    <div class="legend">
      <span><i style="background:var(--amber)"></i>DAYLIGHT AT TARGET</span>
      <span><i style="background:var(--moon)"></i>NIGHT AT TARGET</span>
    </div>
    The rail beside each row shows whether it is day or night in the time zone you are adapting to at that
    moment. Your job is to keep the amber rows awake and the blue rows asleep.
    <div id="store" style="margin-top:10px;font-size:11px;letter-spacing:.03em;opacity:.8"></div>
  </footer>
</div>

<button id="jump">Now</button>

<script>
const Z={CHI:'America/Chicago',SYD:'Australia/Sydney',NYC:'America/New_York',LAX:'America/Los_Angeles'};

// kind: sleep | light | flight | work | crit
const EV=[

 {t:'2026-07-30T02:30Z',k:'sleep',z:Z.CHI,tag:'PRE-PREP',h:'Lights out by 9:30 PM',p:'Last meal by 7:00 PM helps the shift stick.'},
 {t:'2026-07-30T10:00Z',k:'light',z:Z.CHI,tag:'PRE-PREP',h:'Wake 5:00 AM',p:'Light, then breakfast. Front-load the day.'},
 {t:'2026-07-31T02:00Z',k:'sleep',z:Z.CHI,tag:'PRE-PREP',h:'Lights out by 9:00 PM',p:'You are now two hours ahead of your normal clock.'},
 {t:'2026-07-31T09:30Z',k:'light',z:Z.CHI,tag:'PRE-PREP',h:'Wake 4:30 AM',p:'Final prep day. Pack tonight so tomorrow is only travel.'},
 {t:'2026-08-01T02:00Z',k:'sleep',z:Z.CHI,tag:'PRE-PREP',h:'Lights out by 9:00 PM',p:'Seven hours before the longest day of the trip. Protect it.'},

 {t:'2026-08-01T09:00Z',k:'crit',z:Z.CHI,tag:'FORCED WAKE',h:'Up at 4:00 AM — no naps today',p:'The pivot. You will be awake about 25 hours before the sleep block on UA 839. Every nap today costs you a day in Sydney.'},
 {t:'2026-08-01T20:30Z',k:'light',z:Z.CHI,tag:'DEPARTURE DAY',h:'Leave for ORD, 3:30 PM',p:'UA 1967 goes from Terminal 1. Eat a real meal before you fly.'},
 {t:'2026-08-01T23:10Z',k:'flight',z:Z.CHI,tag:'UA 1967 · ORD→LAX',h:'Depart O’Hare, 6:10 PM',p:'4h 30m to LAX, Terminal 1 to Terminal 7. Stay awake — aisle walks, water, no wine.'},
 {t:'2026-08-02T03:40Z',k:'flight',z:Z.CHI,alt:Z.LAX,tag:'CONNECTION · 2H 05M',h:'Land LAX 8:40 PM, Terminal 7',p:'UA 839 also goes from Terminal 7, so no terminal change. Walk the concourse, stay upright, do not find a quiet gate and doze.'},
 {t:'2026-08-02T05:45Z',k:'flight',z:Z.CHI,alt:Z.SYD,tag:'UA 839 · LAX→SYD',h:'Depart LAX, 10:45 PM Pacific',p:'15h 15m. Set your watch to Sydney at the gate — it is 3:45 PM Sunday there.'},
 {t:'2026-08-02T05:45Z',e:'2026-08-02T10:00Z',k:'light',z:Z.SYD,alt:Z.CHI,tag:'IN-FLIGHT · 4H 15M',h:'Stay awake through Sydney afternoon',p:'Reading light on, eat the meal service, one film. Sleeping now would land you at 3 AM Sydney body time.'},
 {t:'2026-08-02T10:00Z',e:'2026-08-02T19:00Z',k:'sleep',z:Z.SYD,alt:Z.CHI,tag:'IN-FLIGHT · 9H',h:'Sleep block — Sydney 8 PM to 5 AM',p:'Eye mask, earplugs, recline. Nine hours of opportunity because you are running on 25 hours awake. Take all of it.'},
 {t:'2026-08-02T19:00Z',e:'2026-08-02T21:00Z',k:'light',z:Z.SYD,alt:Z.CHI,tag:'IN-FLIGHT · 2H',h:'Simulate morning',p:'Mask off, window up, coffee, wash your face, breakfast service. Act like you slept a full night.'},
 {t:'2026-08-02T21:00Z',k:'flight',z:Z.SYD,alt:Z.CHI,tag:'ARRIVAL',h:'Land Sydney 7:00 AM, Terminal 1',p:'Move fast through immigration. Bag drop at the hotel — do not check in and sit down.'},
 {t:'2026-08-02T21:30Z',e:'2026-08-02T23:00Z',k:'light',z:Z.SYD,tag:'ANCHOR',h:'Sunlight walk + breakfast',p:'90 minutes outdoors, no sunglasses. This single block does more than anything else on this list.'},
 {t:'2026-08-02T23:00Z',e:'2026-08-03T07:00Z',k:'work',z:Z.SYD,tag:'WORK',h:'Meetings, 9:00 AM – 5:00 PM',p:'Brightest room you can get. Stand every 30 min. Caffeine cutoff 2:00 PM.'},
 {t:'2026-08-03T12:00Z',k:'sleep',z:Z.SYD,tag:'THE SHIFT',h:'Bed at 10:00 PM Sydney',p:'Sleep here and the transition is done. You wake Tuesday on local time.'},

 {t:'2026-08-03T20:30Z',k:'light',z:Z.SYD,tag:'DAY 2',h:'Wake 6:30 AM + morning light',p:'Expect a 3 AM wake-up tonight. Stay in bed, eyes closed, no phone.'},
 {t:'2026-08-04T12:30Z',k:'sleep',z:Z.SYD,tag:'DAY 2',h:'Bed by 10:30 PM'},
 {t:'2026-08-04T20:30Z',k:'light',z:Z.SYD,tag:'DAY 3',h:'Wake 6:30 AM + morning light'},
 {t:'2026-08-05T12:30Z',k:'sleep',z:Z.SYD,tag:'DAY 3',h:'Bed by 10:30 PM'},
 {t:'2026-08-05T20:30Z',k:'light',z:Z.SYD,tag:'DAY 4',h:'Wake 6:30 AM + morning light',p:'Fully adapted by now. Bank good sleep — you spend it on the flight home.'},
 {t:'2026-08-06T12:30Z',k:'sleep',z:Z.SYD,tag:'DAY 4',h:'Bed by 10:30 PM'},
 {t:'2026-08-06T20:30Z',k:'light',z:Z.SYD,tag:'DAY 5',h:'Wake 6:30 AM + morning light',p:'Last full day. Pack tonight — tomorrow starts at 5:30 AM.'},
 {t:'2026-08-07T11:30Z',k:'sleep',z:Z.SYD,tag:'DAY 5',h:'Bed by 9:30 PM',p:'Eight hours before the flight home. This one matters.'},

 {t:'2026-08-07T19:30Z',k:'light',z:Z.SYD,alt:Z.CHI,tag:'DEPARTURE DAY',h:'Wake 5:30 AM, head to SYD',p:'Full breakfast. Terminal 1. You are about to skip a night.'},
 {t:'2026-08-07T23:30Z',k:'flight',z:Z.SYD,alt:Z.CHI,tag:'UA 842 · SYD→LAX',h:'Depart Sydney, 9:30 AM',p:'13h 40m. Switch your watch to Chicago now — it is Friday 6:30 PM back home.'},
 {t:'2026-08-07T23:30Z',e:'2026-08-08T06:30Z',k:'light',z:Z.CHI,alt:Z.SYD,tag:'IN-FLIGHT · 7H',h:'Force awake — this is Friday night',p:'Lights on, work, films. Sleeping now is what wrecks the NYC week. Hardest block of the trip.'},
 {t:'2026-08-08T06:30Z',e:'2026-08-08T13:10Z',k:'sleep',z:Z.CHI,alt:Z.SYD,tag:'IN-FLIGHT · 6H 40M',h:'Critical sleep block',p:'1:30 AM – 8:10 AM Chicago. This is the real night that carries you through the whole weekend.'},
 {t:'2026-08-08T13:10Z',k:'crit',z:Z.CHI,alt:Z.LAX,tag:'CONNECTION · 2H 05M',h:'Land LAX 6:10 AM, Bradley Terminal',p:'Immigration, bags, recheck, then move to Terminal 7 for UA 1946. Coffee on the way, daylight if you can find open air.',
  warn:'Tightest point of the trip. UA 842 arrives at TBIT and UA 1946 leaves from Terminal 7, so you clear customs and change terminals in 2 hours 5 minutes. UA 842 averages roughly 40 minutes late. Have the next LAX–ORD flight in mind, and consider Global Entry / Mobile Passport if you do not already use it.'},
 {t:'2026-08-08T15:15Z',k:'flight',z:Z.CHI,tag:'UA 1946 · LAX→ORD',h:'Depart LAX, 8:15 AM Pacific',p:'4h 20m. Stay awake the whole way — you are three hours from a real bed.'},
 {t:'2026-08-08T19:35Z',k:'light',z:Z.CHI,tag:'HOME',h:'Land O’Hare, 2:35 PM',p:'Unpack, walk outside, laundry. Keep moving until dark. No couch.'},
 {t:'2026-08-09T03:00Z',k:'sleep',z:Z.CHI,tag:'HOME',h:'Bed at 10:00 PM',p:'Aim for 9–10 hours. Do not set an aggressive alarm.'},

 {t:'2026-08-09T12:00Z',k:'light',z:Z.CHI,tag:'RECOVERY DAY',h:'Wake ~7:00 AM, get outside first',p:'The point of this day: one full Chicago day and night on the ground before NYC.'},
 {t:'2026-08-09T14:00Z',k:'light',z:Z.CHI,tag:'RECOVERY DAY',h:'Easy movement, 30–45 min',p:'Walk or light gym. Nothing hard — the sleep debt is still real.'},
 {t:'2026-08-09T17:00Z',k:'light',z:Z.CHI,tag:'RECOVERY DAY',h:'Proper lunch',p:'Regular meal times reset the clock almost as strongly as light does.'},
 {t:'2026-08-09T19:00Z',k:'crit',z:Z.CHI,tag:'RECOVERY DAY',h:'Nap window closes — 2:00 PM',p:'A nap before now, 20 minutes maximum. After now, nothing. Pack for NYC instead.'},
 {t:'2026-08-09T21:30Z',k:'flight',z:Z.CHI,tag:'NYC TRANSIT',h:'Leave for ORD, 4:30 PM',p:'Sunday evening traffic. Give yourself the extra half hour.'},
 {t:'2026-08-09T23:29Z',k:'flight',z:Z.CHI,alt:Z.NYC,tag:'NYC TRANSIT',h:'Depart O’Hare, 6:29 PM',p:'Short hop. No alcohol, no sleeping.'},
 {t:'2026-08-10T01:45Z',k:'flight',z:Z.NYC,tag:'NYC ARRIVAL',h:'Land New York, 9:45 PM',p:'Straight to the hotel. Only one hour off Chicago — you are effectively home.'},
 {t:'2026-08-10T03:30Z',k:'sleep',z:Z.NYC,tag:'NYC',h:'Bed at 11:30 PM',p:'Normal local bedtime locks in the week.'},
 {t:'2026-08-10T11:00Z',k:'light',z:Z.NYC,tag:'DONE',h:'Wake 7:00 AM — fully reset',p:'Fifteen time zones out and back, with one clean week on each end.'}
];
EV.forEach((e,i)=>e.id='e'+i);

const TAGCLS={sleep:'t-sleep',light:'t-light',flight:'t-flight',work:'t-light',crit:'t-crit'};
const KEY='sydney-protocol-v2';
let done=new Set(), zoneMode='auto', hideDone=false;

const fmtT=(d,z)=>new Intl.DateTimeFormat('en-US',{timeZone:z,hour:'numeric',minute:'2-digit',hour12:true}).format(d).replace(' ','');
const fmtD=(d,z)=>new Intl.DateTimeFormat('en-US',{timeZone:z,weekday:'short',month:'short',day:'numeric'}).format(d);
const fmtDay=(d,z)=>new Intl.DateTimeFormat('en-US',{timeZone:z,weekday:'long',month:'short',day:'numeric'}).format(d);
const key=(d,z)=>new Intl.DateTimeFormat('en-CA',{timeZone:z,year:'numeric',month:'2-digit',day:'2-digit'}).format(d);
const hourIn=(d,z)=>+new Intl.DateTimeFormat('en-US',{timeZone:z,hour:'numeric',hour12:false}).format(d)%24;
const isDay=(d,z)=>{const h=hourIn(d,z);return h>=6&&h<18};
const abbr=z=>({[Z.CHI]:'CHI',[Z.SYD]:'SYD',[Z.NYC]:'NYC',[Z.LAX]:'LAX'})[z];

function dispZone(e){ return zoneMode==='auto' ? e.z : zoneMode; }
function altZone(e){
  const p=dispZone(e);
  if(zoneMode==='auto') return e.alt&&e.alt!==p?e.alt:null;
  return e.z!==p?e.z:null;
}

/* ---------- storage ----------
   localStorage first so the file works offline once saved to the device
   (mid-Pacific, no signal). window.storage mirrors it inside the Claude app,
   where localStorage may be sandboxed off. Whichever survives, wins. */
let store='none';
function lsGet(){try{return localStorage.getItem(KEY)}catch(_){return null}}
function lsSet(v){try{localStorage.setItem(KEY,v);return true}catch(_){return false}}
function lsDel(){try{localStorage.removeItem(KEY)}catch(_){}}

async function load(){
  let raw=lsGet();
  if(raw)store='local';
  if(!raw){
    try{const r=await window.storage.get(KEY); if(r&&r.value){raw=r.value;store='app'}}catch(_){}
  }
  if(raw){try{done=new Set(JSON.parse(raw))}catch(_){}}
  if(store==='none')store=lsSet(lsGet()??'[]')?'local':'app';
  stamp();
}
async function save(){
  const v=JSON.stringify([...done]);
  if(lsSet(v))store='local';
  try{await window.storage.set(KEY,v)}catch(_){ }
  stamp();
}
function stamp(){
  const el=document.getElementById('store');
  if(!el)return;
  el.textContent = store==='local'
    ? 'Saving to this browser’s local storage — works offline.'
    : 'Saving to app storage. Local storage is blocked here; download the file and open it directly for offline saving.';
}

/* ---------- render ---------- */
function render(){
  const tl=document.getElementById('timeline');
  tl.innerHTML='';
  const now=Date.now();
  let groups=[],cur=null;
  EV.forEach(e=>{
    if(hideDone&&done.has(e.id))return;
    const d=new Date(e.t), z=dispZone(e), k=key(d,z)+'|'+z;
    if(!cur||cur.k!==k){cur={k,z,d,items:[]};groups.push(cur);}
    cur.items.push(e);
  });

  groups.forEach(g=>{
    const G=document.createElement('section');G.className='daygrp';
    const H=document.createElement('div');H.className='dayhead';
    H.innerHTML=`<span class="disp dl">${fmtDay(g.d,g.z)}</span><span class="dz mono">${abbr(g.z)}</span><span class="strip"></span>`;
    // 24h day/night strip for this group's zone
    const stops=[];
    for(let h=0;h<24;h++){const c=(h>=6&&h<18)?'var(--amber)':'var(--moon)';
      stops.push(`${c} ${(h/24*100).toFixed(1)}%`,`${c} ${((h+1)/24*100).toFixed(1)}%`);}
    H.querySelector('.strip').style.background=`linear-gradient(90deg,${stops.join(',')})`;
    H.querySelector('.strip').style.opacity='.4';
    G.appendChild(H);

    g.items.forEach(e=>{
      const st=new Date(e.t).getTime(), en=e.e?new Date(e.e).getTime():null;
      const live=en?(now>=st&&now<en):(now>=st&&now<st+30*60000);
      const past=en?now>=en:now>=st+30*60000;
      const z=dispZone(e), az=altZone(e), d=new Date(e.t);
      const row=document.createElement('article');
      row.className='ev'+(done.has(e.id)?' done':'')+(live?' live':'')+(past?' past':'');
      row.id=e.id;
      const durTxt=en?`${Math.round((en-st)/3600000*10)/10}h block · ends ${fmtT(new Date(en),z)}`:'';
      row.innerHTML=`
        <div class="rail" style="background:${isDay(d,e.z)?'var(--rail-day)':'var(--rail-night)'}"></div>
        <div class="time mono">${fmtT(d,z)}${az?`<span class="alt">${fmtT(d,az)} ${abbr(az)}</span>`:''}</div>
        <div class="body">
          <span class="tag mono ${TAGCLS[e.k]}">${e.tag}</span>
          <h3>${e.h}</h3>
          ${e.p?`<p>${e.p}</p>`:''}
          ${durTxt?`<div class="dur mono">${durTxt}</div>`:''}
          ${e.warn?`<div class="warn"><b>Verify:</b> ${e.warn}</div>`:''}
        </div>
        <button class="tick" aria-label="Mark done" aria-pressed="${done.has(e.id)}">
          <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
        </button>`;
      row.querySelector('.tick').addEventListener('click',()=>{
        done.has(e.id)?done.delete(e.id):done.add(e.id);save();render();
      });
      G.appendChild(row);
    });
    tl.appendChild(G);
  });
}

/* ---------- now / clocks ---------- */
function tick(){
  const now=new Date(), t=now.getTime();

  // clocks
  const cs=[[Z.CHI,'CHICAGO'],[Z.SYD,'SYDNEY'],[Z.NYC,'NEW YORK']];
  document.getElementById('clocks').innerHTML=cs.map(([z,n])=>{
    const here=curEvent()&&dispZone(curEvent())===z;
    return `<div class="clock${here?' here':''}"><div class="city mono">${n}</div>
      <div class="t mono">${fmtT(now,z)}</div><div class="d mono">${fmtD(now,z)}</div></div>`;
  }).join('');

  const c=curEvent(), n=nextEvent();
  const nt=document.getElementById('nowtitle'), ns=document.getElementById('nowsub'),
        nm=document.getElementById('nowmeta'), nb=document.getElementById('nowbar'),
        nl=document.getElementById('nowlabel');

  if(c){
    const st=new Date(c.t).getTime(), en=c.e?new Date(c.e).getTime():st+30*60000;
    nl.textContent='RIGHT NOW · '+c.tag;
    nt.textContent=c.h; ns.textContent=c.p||'';
    const pct=Math.min(100,Math.max(0,(t-st)/(en-st)*100));
    nb.style.width=pct+'%';
    nm.textContent=c.e?`${dur(en-t)} left in this block`:`started ${dur(t-st)} ago`;
    document.body.classList.toggle('night',c.k==='sleep');
  }else{
    nl.textContent='RIGHT NOW';
    const started=t>=new Date(EV[0].t).getTime();
    nt.textContent=started?'Between blocks':'Protocol starts tonight';
    ns.textContent=started?'Nothing scheduled. Hold your current wake or sleep window.':'First action is tonight’s 11:00 PM bedtime.';
    nb.style.width='0%'; nm.textContent='';
    document.body.classList.toggle('night',!isDay(now,Z.CHI));
  }

  document.getElementById('nexttxt').textContent=n?`${fmtT(new Date(n.t),dispZone(n))} ${abbr(dispZone(n))} · ${n.h}`:'Trip complete';
  document.getElementById('nextcd').textContent=n?dur(new Date(n.t).getTime()-t):'✓';
}
function curEvent(){
  const t=Date.now();
  for(let i=EV.length-1;i>=0;i--){
    const e=EV[i], st=new Date(e.t).getTime(), en=e.e?new Date(e.e).getTime():st+30*60000;
    if(t>=st&&t<en)return e;
  }
  return null;
}
function nextEvent(){const t=Date.now();return EV.find(e=>new Date(e.t).getTime()>t)||null;}
function dur(ms){
  if(ms<0)ms=0;
  const m=Math.floor(ms/60000),d=Math.floor(m/1440),h=Math.floor(m%1440/60),mm=m%60;
  if(d>0)return `${d}d ${h}h`;
  if(h>0)return `${h}h ${String(mm).padStart(2,'0')}m`;
  return `${mm}m`;
}

/* ---------- controls ---------- */
document.querySelectorAll('.seg button').forEach(b=>b.addEventListener('click',()=>{
  document.querySelectorAll('.seg button').forEach(x=>x.setAttribute('aria-pressed',x===b));
  zoneMode=b.dataset.z; render(); tick();
}));
document.getElementById('hidedone').addEventListener('click',e=>{
  hideDone=!hideDone; e.target.setAttribute('aria-pressed',hideDone);
  e.target.textContent=hideDone?'Show all':'Hide done'; render();
});
document.getElementById('reset').addEventListener('click',()=>{
  if(confirm('Clear every checkmark?')){done.clear();lsDel();save();render();}
});
document.getElementById('jump').addEventListener('click',()=>{
  const c=curEvent()||nextEvent();
  if(c)document.getElementById(c.id)?.scrollIntoView({behavior:'smooth',block:'center'});
});

(async()=>{await load();render();tick();setInterval(tick,1000);
  setTimeout(()=>document.getElementById('jump').click(),400);})();
</script>
