<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>stega-now</title>
    <style>
      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        display: flex;
        flex-direction: column;
        font: 14px/1.5 monospace;
        background: #fff;
        color: #000;
      }
      button {
        font: inherit;
      }
      #bar {
        display: none;
        gap: 6px;
        align-items: center;
        padding: 6px 8px;
        border-bottom: 1px solid;
        flex-wrap: wrap;
      }
      #bar.on {
        display: flex;
      }
      #bar .sp {
        flex: 1;
      }
      #stage {
        flex: 1;
        min-height: 0;
        display: none;
      }
      #stage.on {
        display: block;
      }
      #stage iframe {
        width: 100%;
        height: 100%;
        border: 0;
        display: block;
      }
      #stage .pane {
        width: 100%;
        height: 100%;
        overflow: auto;
        padding: 16px;
        box-sizing: border-box;
      }
      #stage img {
        max-width: 100%;
        image-rendering: pixelated;
      }
      #stage pre {
        margin: 0;
        white-space: pre-wrap;
        word-break: break-word;
      }
      #lib {
        padding: 16px;
      }
      #grid {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin: 12px 0;
      }
      .cart {
        padding: 8px;
        border: 1px solid;
        background: none;
        cursor: pointer;
        user-select: none;
        -webkit-user-select: none;
        touch-action: manipulation;
      }
      .cart img {
        display: block;
        width: 128px;
        image-rendering: pixelated;
        margin: 0 auto 6px;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="bar">
      <span id="cartname"></span>
      <span id="tabs"></span>
      <span class="sp"></span>
      <button id="eject">eject</button>
    </div>

    <div id="stage"></div>

    <div id="lib">
      <div>stega-now</div>
      <div id="grid"></div>
      <div>
        <button id="add">add</button>
        <input type="file" id="file" accept="image/png,image/*" hidden />
      </div>
      <p id="hint" hidden>hold a cartridge down to delete it</p>
      <p id="err"></p>
    </div>

    <script src="lib/steg-core.js"></script>
    <script>
      "use strict";
      /* ==========================================================
         stega-now — playback for stegassette STGC cartridge PNGs.
         Decodes in-browser via steg-core and plays back entries:
           text/html → sandboxed full-viewport app
           text/*    → text
           image/*   → image
           audio/L*  → raw STGC PCM via Web Audio
           audio/*   → <audio> element
           anything  → download link
         Cartridges you add are kept in localStorage; when nothing
         is playing, the library shows them. Click to play, hold to
         delete. ?src=<url> fetches, stores, and plays a cartridge.
         ========================================================== */

      const LIB = "stega-now:lib";
      const ACT = "stega-now:active";
      const appKey = (id) => "stega-now:app:" + id;
      const $ = (id) => document.getElementById(id);

      let current = null; // { rec, entries, opts }
      let selected = -1;
      let appFrame = null;
      let audioCtx = null,
        audioSrc = null,
        audioTimer = null;
      const blobUrls = [];

      // ---- storage ------------------------------------------------
      function b64FromBytes(u8) {
        let s = "";
        for (let i = 0; i < u8.length; i += 0x8000)
          s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000));
        return btoa(s);
      }
      function bytesFromB64(b64) {
        const s = atob(b64);
        const u8 = new Uint8Array(s.length);
        for (let i = 0; i < s.length; i++) u8[i] = s.charCodeAt(i);
        return u8;
      }
      function readLib() {
        try {
          return JSON.parse(localStorage.getItem(LIB)) || [];
        } catch (_) {
          return [];
        }
      }
      function writeLib(lib) {
        localStorage.setItem(LIB, JSON.stringify(lib));
      }
      function addToLib(name, bytes) {
        const b64 = b64FromBytes(bytes);
        const lib = readLib();
        const dup = lib.find((r) => r.b64 === b64);
        if (dup) return dup;
        const rec = {
          id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
          name,
          b64,
        };
        try {
          writeLib(lib.concat([rec]));
        } catch (_) {
          alert("cartridge too big for local storage — playing without saving");
        }
        return rec;
      }
      function removeFromLib(id) {
        try {
          writeLib(readLib().filter((r) => r.id !== id));
          localStorage.removeItem(appKey(id));
          if (localStorage.getItem(ACT) === id) localStorage.removeItem(ACT);
        } catch (_) {}
      }

      // ---- decode -------------------------------------------------
      async function decodeBytes(bytes) {
        const blob = new Blob([bytes], { type: "image/png" });
        let bmp;
        try {
          bmp = await createImageBitmap(blob, { colorSpaceConversion: "none" });
        } catch (_) {
          bmp = await createImageBitmap(blob);
        }
        const W = bmp.width,
          H = bmp.height;
        const cnv = Object.assign(document.createElement("canvas"), {
          width: W,
          height: H,
        });
        const ctx = cnv.getContext("2d", { willReadFrequently: true });
        ctx.drawImage(bmp, 0, 0);
        bmp.close();
        const px = ctx.getImageData(0, 0, W, H).data;
        const img = new StegCore.Img(W, H, new Uint8Array(px));
        return StegCore.decodeContainer(img, img); // { entries, opts }
      }

      function kindOf(mimetype) {
        const m = (mimetype || "").toLowerCase();
        if (m.startsWith("text/html")) return "html";
        if (m.startsWith("audio/l")) return "pcm";
        if (m.startsWith("audio/")) return "audio";
        if (m.startsWith("image/")) return "image";
        if (m.startsWith("text/") || m === "application/json") return "text";
        return "file";
      }

      // ---- sandbox + storage bridge -------------------------------
      // html entries run in a sandboxed iframe (opaque origin — no access
      // to this site or other cartridges). The sandbox also blocks the
      // cartridge's own localStorage, so a synchronous shim is injected,
      // seeded from this cartridge's saved data; writes post back here and
      // persist under "stega-now:app:<id>".
      function shimHtml(html, seedObj) {
        const seed = JSON.stringify(seedObj).replace(/</g, "\\u003c");
        const shim =
          "<script>(function(){" +
          "var data=" +
          seed +
          ";" +
          'function sync(){try{parent.postMessage({stegaNow:"store",data:data},"*")}catch(_){}}' +
          "var shim={getItem:function(k){k=String(k);return Object.prototype.hasOwnProperty.call(data,k)?data[k]:null}," +
          "setItem:function(k,v){data[String(k)]=String(v);sync()}," +
          "removeItem:function(k){delete data[String(k)];sync()}," +
          "clear:function(){data={};sync()}," +
          "key:function(i){var ks=Object.keys(data);return i in ks?ks[i]:null}};" +
          'Object.defineProperty(shim,"length",{get:function(){return Object.keys(data).length}});' +
          "try{window.localStorage.getItem}catch(_){" +
          'try{Object.defineProperty(window,"localStorage",{configurable:true,get:function(){return shim}})}catch(_){}}' +
          "})()<\/scr" +
          "ipt>";
        // inject after <head>/<html>/doctype — a script before <!DOCTYPE>
        // would flip the cartridge document into quirks mode
        const m =
          html.match(/<head[^>]*>/i) ||
          html.match(/<html[^>]*>/i) ||
          html.match(/<!doctype[^>]*>/i);
        if (m) {
          const at = m.index + m[0].length;
          return html.slice(0, at) + shim + html.slice(at);
        }
        return shim + html;
      }
      window.addEventListener("message", (e) => {
        if (
          current &&
          appFrame &&
          e.source === appFrame &&
          e.data &&
          e.data.stegaNow === "store"
        ) {
          try {
            localStorage.setItem(
              appKey(current.rec.id),
              JSON.stringify(e.data.data || {}),
            );
          } catch (_) {}
        }
      });
      function readAppData(id) {
        try {
          return JSON.parse(localStorage.getItem(appKey(id))) || {};
        } catch (_) {
          return {};
        }
      }

      // ---- playback -----------------------------------------------
      function stopAudio() {
        if (audioSrc) {
          try {
            audioSrc.stop();
          } catch (_) {}
          audioSrc = null;
        }
        if (audioTimer) {
          clearInterval(audioTimer);
          audioTimer = null;
        }
      }
      function clearStage() {
        stopAudio();
        appFrame = null;
        for (const u of blobUrls.splice(0)) URL.revokeObjectURL(u);
        $("stage").innerHTML = "";
      }

      function fmtTime(s) {
        s = Math.max(0, Math.round(s));
        return ((s / 60) | 0) + ":" + String(s % 60).padStart(2, "0");
      }

      function buildPcmPlayer(e) {
        const fmt = StegCore.parseAudioMime(e.mimetype);
        const f32 = StegCore.toFloat32(e.data, fmt.bits);
        const planar = StegCore.unlayoutChannels({
          f32,
          layout: fmt.layout,
          channels: fmt.channels,
          blockSize: fmt.blockSize,
        });
        const N = (planar.length / fmt.channels) | 0;
        const dur = N / fmt.rate;

        const pane = document.createElement("div");
        pane.className = "pane";
        const btn = document.createElement("button");
        btn.textContent = "play";
        const prog = document.createElement("progress");
        prog.max = 1;
        prog.value = 0;
        const tm = document.createElement("span");
        tm.textContent = " 0:00 / " + fmtTime(dur);
        pane.append(
          (e.name || "audio") +
            " (" +
            fmt.bits +
            "-bit " +
            fmt.rate +
            " Hz × " +
            fmt.channels +
            "ch) ",
          btn,
          " ",
          prog,
          tm,
        );

        let startedAt = 0,
          playing = false;
        btn.addEventListener("click", () => {
          if (playing) {
            stopAudio();
            btn.textContent = "play";
            playing = false;
            return;
          }
          audioCtx =
            audioCtx ||
            new (window.AudioContext || window.webkitAudioContext)();
          const buf = audioCtx.createBuffer(fmt.channels, N, fmt.rate);
          for (let c = 0; c < fmt.channels; c++)
            buf.getChannelData(c).set(planar.subarray(c * N, (c + 1) * N));
          stopAudio();
          audioSrc = audioCtx.createBufferSource();
          audioSrc.buffer = buf;
          audioSrc.connect(audioCtx.destination);
          audioSrc.onended = () => {
            btn.textContent = "play";
            playing = false;
            prog.value = 0;
            clearInterval(audioTimer);
          };
          startedAt = audioCtx.currentTime;
          audioSrc.start();
          playing = true;
          btn.textContent = "stop";
          audioTimer = setInterval(() => {
            const t = Math.min(dur, audioCtx.currentTime - startedAt);
            prog.value = t / dur;
            tm.textContent = " " + fmtTime(t) + " / " + fmtTime(dur);
          }, 100);
        });
        return pane;
      }

      function showEntry(i) {
        const e = current.entries[i];
        if (!e) return;
        selected = i;
        clearStage();
        const stage = $("stage");
        const kind = kindOf(e.mimetype);

        if (kind === "html") {
          const iframe = document.createElement("iframe");
          iframe.setAttribute(
            "sandbox",
            "allow-scripts allow-forms allow-modals allow-downloads",
          );
          iframe.allow = "fullscreen";
          iframe.srcdoc = shimHtml(
            new TextDecoder().decode(e.data),
            readAppData(current.rec.id),
          );
          stage.appendChild(iframe);
          appFrame = iframe.contentWindow;
        } else if (kind === "text") {
          const pane = document.createElement("div");
          pane.className = "pane";
          const pre = document.createElement("pre");
          pre.textContent = new TextDecoder().decode(e.data);
          pane.appendChild(pre);
          stage.appendChild(pane);
        } else if (kind === "image") {
          const pane = document.createElement("div");
          pane.className = "pane";
          const img = document.createElement("img");
          const url = URL.createObjectURL(
            new Blob([e.data], { type: e.mimetype }),
          );
          blobUrls.push(url);
          img.src = url;
          img.alt = e.name || "image entry";
          pane.appendChild(img);
          stage.appendChild(pane);
        } else if (kind === "audio") {
          const pane = document.createElement("div");
          pane.className = "pane";
          const au = document.createElement("audio");
          au.controls = true;
          const url = URL.createObjectURL(
            new Blob([e.data], { type: e.mimetype }),
          );
          blobUrls.push(url);
          au.src = url;
          pane.appendChild(au);
          stage.appendChild(pane);
        } else if (kind === "pcm") {
          stage.appendChild(buildPcmPlayer(e));
        } else {
          const pane = document.createElement("div");
          pane.className = "pane";
          const a = document.createElement("a");
          const url = URL.createObjectURL(
            new Blob([e.data], {
              type: e.mimetype || "application/octet-stream",
            }),
          );
          blobUrls.push(url);
          a.href = url;
          a.download = e.name || "entry.bin";
          a.textContent = "download " + (e.name || "entry");
          pane.appendChild(a);
          stage.appendChild(pane);
        }
        renderTabs();
      }

      function renderTabs() {
        const tabs = $("tabs");
        tabs.innerHTML = "";
        if (current.entries.length < 2) return;
        current.entries.forEach((e, i) => {
          const b = document.createElement("button");
          b.textContent = e.name || kindOf(e.mimetype) + " " + i;
          b.disabled = i === selected;
          b.addEventListener("click", () => showEntry(i));
          tabs.appendChild(b);
        });
      }

      async function play(rec) {
        let dec;
        try {
          dec = await decodeBytes(bytesFromB64(rec.b64));
        } catch (err) {
          $("err").textContent = "✗ " + rec.name + ": " + err.message;
          removeActive();
          return false;
        }
        current = { rec, entries: dec.entries, opts: dec.opts };
        try {
          localStorage.setItem(ACT, rec.id);
        } catch (_) {}
        $("lib").hidden = true;
        $("bar").classList.add("on");
        $("stage").classList.add("on");
        $("cartname").textContent = rec.name;
        const first = dec.entries.findIndex(
          (e) => kindOf(e.mimetype) === "html",
        );
        showEntry(first >= 0 ? first : 0);
        return true;
      }

      function removeActive() {
        try {
          localStorage.removeItem(ACT);
        } catch (_) {}
      }

      function eject() {
        clearStage();
        current = null;
        selected = -1;
        removeActive();
        $("bar").classList.remove("on");
        $("stage").classList.remove("on");
        $("lib").hidden = false;
        renderGrid();
      }

      // ---- library ------------------------------------------------
      function renderGrid() {
        const grid = $("grid");
        grid.innerHTML = "";
        const lib = readLib();
        $("hint").hidden = !lib.length;
        for (const rec of lib) {
          const b = document.createElement("button");
          b.className = "cart";
          const img = document.createElement("img");
          img.src = "data:image/png;base64," + rec.b64;
          img.alt = rec.name;
          b.appendChild(img);
          b.appendChild(document.createTextNode(rec.name));

          let holdT = null,
            held = false;
          b.addEventListener("pointerdown", () => {
            held = false;
            holdT = setTimeout(() => {
              held = true;
              if (confirm("delete " + rec.name + "?")) {
                removeFromLib(rec.id);
                renderGrid();
              }
            }, 650);
          });
          for (const t of ["pointerup", "pointerleave", "pointercancel"])
            b.addEventListener(t, () => clearTimeout(holdT));
          b.addEventListener("contextmenu", (e) => e.preventDefault());
          b.addEventListener("click", (e) => {
            if (held) {
              e.preventDefault();
              return;
            }
            $("err").textContent = "";
            play(rec);
          });
          grid.appendChild(b);
        }
      }

      // ---- wiring -------------------------------------------------
      $("eject").addEventListener("click", eject);
      $("add").addEventListener("click", () => $("file").click());
      $("file").addEventListener("change", async (e) => {
        const f = e.target.files[0];
        if (!f) return;
        e.target.value = "";
        $("err").textContent = "";
        const bytes = new Uint8Array(await f.arrayBuffer());
        try {
          await decodeBytes(bytes); // validate before storing
        } catch (err) {
          $("err").textContent = "✗ " + f.name + ": " + err.message;
          return;
        }
        play(addToLib(f.name, bytes));
      });

      // ---- startup ------------------------------------------------
      (async () => {
        const qs = new URLSearchParams(location.search);
        const src = qs.get("src");
        if (src) {
          try {
            const r = await fetch(src);
            if (!r.ok) throw new Error("fetch failed: " + r.status);
            const bytes = new Uint8Array(await r.arrayBuffer());
            await decodeBytes(bytes);
            if (
              await play(addToLib(src.split("/").pop() || "cartridge.png", bytes))
            )
              return;
          } catch (err) {
            $("err").textContent = "✗ " + err.message;
          }
        }
        const act = localStorage.getItem(ACT);
        const rec = readLib().find((r) => r.id === act);
        if (rec && (await play(rec))) return;
        renderGrid();
      })();
    </script>
  </body>
</html>
